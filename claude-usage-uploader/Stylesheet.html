<style>
:root {
  /* ================================================================
     SIGMA SOLVE LIGHT THEME (default)
     ================================================================
     Rewritten 2026-07-31 from the previous dark "Obsidian" palette to a
     clean white/light surface. Almost every rule in this file already reads
     these variables, so redefining them here converts the whole dashboard —
     all pages — in one place. A LIGHT THEME OVERRIDES block at the bottom of
     this file fixes the handful of rules that hardcoded dark-only assumptions
     (white-on-white highlights, screen-blend glows, light-on-dark particles).

     Status colours are DARKENED versus the dark theme: #00E676 green and
     #FFB300 amber are readable on near-black but fail contrast on white, so
     they move to their 600/700-weight equivalents. The brand blue #0047FB is
     already strong on white and is unchanged.                              */

  --bg:  #f1f5f9;                       /* app background — soft grey, not pure white,
                                           so white cards read as raised surfaces */
  --bg2: #ffffff;                       /* sidebar / topbar / table headers */
  --bg3: #ffffff;                       /* card surface */
  --glass:    rgba(15, 23, 42, 0.025);  /* subtle fills — now dark-on-light, was white-on-dark */
  --glass-b:  rgba(15, 23, 42, 0.11);   /* borders */
  --glass-hv: rgba(15, 23, 42, 0.055);  /* hover fills */

  /* Accent Colors — Sigma Solve brand: deep blue -> cyan (sampled from the logo mark) */
  --indigo: #0047FB;                    /* Sigma Solve Blue */
  --purple: #0087BD;                    /* Sigma Solve Cyan, darkened for white-bg contrast */
  --cyan:   #0087BD;                    /* Sigma Solve Cyan, darkened for white-bg contrast */
  --green:  #059669;                    /* status green — darkened for legibility on white */
  --amber:  #B45309;                    /* status amber — darkened for legibility on white */
  --red:    #DC2626;                    /* status red — darkened for legibility on white */

  /* Text Theme — inverted: dark text on light surfaces */
  --t1: #0f172a;                        /* primary text */
  --t2: #475569;                        /* secondary */
  --t3: #64748b;                        /* muted / labels */
  --t4: #94a3b8;                        /* faintest / disabled */

  /* Surface chrome */
  --sidebar-bg: #ffffff;
  --topbar-bg:  rgba(255, 255, 255, 0.88);

  /* Shadows & Radii — real depth shadows replace the dark theme's glows.
     On white, a coloured "glow" reads as a smudge, so these become tight
     tinted rings that still convey focus/state without looking blurry. */
  --r: 10px;
  --rs: 8px;
  --rx: 7px;
  --shadow: 0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.07);
  --glow-indigo: 0 0 0 3px rgba(0, 71, 251, 0.14);
  --glow-green:  0 0 0 3px rgba(5, 150, 105, 0.14);
  --glow-red:    0 0 0 3px rgba(220, 38, 38, 0.14);
  --glow-amber:  0 0 0 3px rgba(180, 83, 9, 0.14);
  --glow-cyan:   0 0 0 3px rgba(0, 135, 189, 0.14);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  scrollbar-width: thin;
  scrollbar-color: rgba(0, 71, 251, 0.38) var(--bg2);
}

/* Scrollbar styles */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: var(--bg2);
}
::-webkit-scrollbar-thumb {
  background: rgba(0, 71, 251, 0.38);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--t3);
}

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  /* Light theme: a barely-there brand tint in the corners keeps the page from
     looking like flat printer paper, without competing with card content. */
  background:
    radial-gradient(ellipse 60% 50% at 15% 0%,  rgba(0, 71, 251, 0.05) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 90% 10%, rgba(0, 135, 189, 0.05) 0%, transparent 55%),
    var(--bg);
  background-size: cover, cover, cover;
  background-attachment: fixed;
  color: var(--t1);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.5;
}

/* APP SHELL */
.app-shell{display:flex;height:100vh;overflow:hidden;position:relative;z-index:1}

/* SIDEBAR */
.sidebar{width:240px;flex-shrink:0;background:var(--sidebar-bg);border-right:1px solid var(--glass-b);
  display:flex;flex-direction:column;transition:width .3s;overflow:hidden;z-index:100}
/* The embedded logo has WHITE wordmark text baked into the PNG, so on a white
   sidebar the "Sigma Solve" text would be invisible. Sit it on a dark brand
   chip — deliberate-looking, and keeps the logo legible without needing a
   separate dark-text asset. Swap in a dark-text logo and this can go away. */
.sidebar-brand{padding:16px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--glass-b)}
.sidebar-brand img{width:auto;max-width:100%;height:38px;object-fit:contain;border-radius:0;display:block;margin:0 auto}
.brand-chip{background:linear-gradient(135deg,#0b1220,#132038);border-radius:10px;padding:10px 14px;width:100%;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(15,23,42,.14)}
.sidebar-brand-text{font-size:13px;font-weight:700;letter-spacing:-.3px}
.sidebar-brand-sub{font-size:10px;color:var(--t3);margin-top:1px}
.sidebar-nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;
  font-size:13px;font-weight:500;color:var(--t3);cursor:pointer;transition:all .2s;margin-bottom:2px;
  border:1px solid transparent;user-select:none}
.nav-item:hover{background:var(--glass-hv);color:var(--t2)}
.nav-item.active{background:rgba(0,71,251,.12);color:var(--indigo);border-color:rgba(0,71,251,.25);
  box-shadow:0 0 12px rgba(0,71,251,.15)}
.nav-item .nav-icon{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.nav-label{font-size:10px;font-weight:700;color:var(--t4);text-transform:uppercase;letter-spacing:.8px;
  padding:16px 14px 6px;user-select:none}
.sidebar-footer{padding:14px 18px;border-top:1px solid var(--glass-b);font-size:11px;color:var(--t3)}
.sidebar-footer .sync-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);
  margin-right:6px;animation:pulse-g 2s infinite}

/* MAIN AREA */
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* TOP BAR */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;
  border-bottom:1px solid var(--glass-b);background:var(--topbar-bg);backdrop-filter:blur(16px);
  flex-shrink:0;gap:12px;flex-wrap:wrap;z-index:50}
.top-bar-left{display:flex;align-items:center;gap:12px}
.page-title{font-size:18px;font-weight:700;letter-spacing:-.4px}
.top-bar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* CONTENT SCROLL */
.content-scroll{flex:1;overflow-y:auto;padding:24px;max-width:1400px}

/* PAGE VIEW */
.page-view{display:none;animation:fadeUp .3s ease both}
.page-view.active{display:block}

/* KPI STRIP */
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:24px}
.kpi-card{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--rs);
  padding:18px 16px;backdrop-filter:blur(12px);transition:all .3s;position:relative;overflow:hidden}
.kpi-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.18);
  box-shadow:0 8px 30px rgba(0,0,0,.4)}
.kpi-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--indigo),transparent);opacity:0;transition:opacity .3s}
.kpi-card:hover::after{opacity:1}
.kpi-val{font-size:28px;font-weight:800;letter-spacing:-1.2px;font-variant-numeric:tabular-nums}
.kpi-label{font-size:10px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.kpi-sub{font-size:11px;color:var(--t3);margin-top:6px;font-variant-numeric:tabular-nums}

/* ALERT RAIL */
.alert-rail{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.alert-chip{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
  font-size:12px;font-weight:500;border:1px solid;backdrop-filter:blur(8px)}
.alert-chip.alert-warn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.3);color:var(--amber)}
.alert-chip.alert-crit{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.3);color:var(--red)}
.alert-chip.alert-info{background:rgba(0,174,239,.08);border-color:rgba(0,174,239,.3);color:var(--cyan)}
.alert-chip.alert-ok{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.3);color:var(--green)}

/* SECTION HEADER */
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.section-title{font-size:14px;font-weight:700;letter-spacing:-.2px}
.section-sub{font-size:11px;color:var(--t3)}

/* RIGHT DRAWER */
.drawer-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);backdrop-filter:blur(3px)}
.drawer-overlay.open{display:block;animation:fadeIn .15s ease}
.drawer{position:fixed;top:0;right:-420px;width:420px;height:100vh;background:var(--bg2);
  border-left:1px solid var(--glass-b);z-index:201;transition:right .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:-8px 0 40px rgba(0,0,0,.5)}
.drawer.open{right:0}
.drawer-hd{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;
  border-bottom:1px solid var(--glass-b);flex-shrink:0}
.drawer-hd h3{font-size:14px;font-weight:700}
.drawer-body{flex:1;overflow-y:auto;padding:20px}

/* PAGE (legacy compat) */
.page-wrap{position:relative;z-index:1;max-width:1380px;margin:0 auto;padding:28px 24px 100px;display:none}

/* SIDEBAR RESPONSIVE */
@media(max-width:860px){
  .sidebar{width:56px}
  .sidebar-brand-text,.sidebar-brand-sub,.nav-item span:not(.nav-icon),.nav-label,.sidebar-footer span{display:none}
  .nav-item{justify-content:center;padding:10px}
  .sidebar-brand{justify-content:center;padding:12px}
  .sidebar-brand img{width:28px;height:28px}
  .drawer{width:100%}
}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:40px}
.hd-left{display:flex;align-items:center;gap:14px}
.hd-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hd-logo{width:48px;height:48px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,#0047FB,#00AEEF);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;box-shadow:var(--glow-indigo)}
.hd-title{font-size:21px;font-weight:700;letter-spacing:-.5px}
.hd-sub{font-size:12px;color:var(--t3);margin-top:2px}
.hd-badge{font-size:12px;color:var(--t2);background:var(--glass);border:1px solid var(--glass-b);
  border-radius:20px;padding:5px 15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hd-time{font-size:11px;color:var(--t3)}
.btn-refresh{display:inline-flex;align-items:center;gap:7px;background:var(--glass);
  border:1px solid var(--glass-b);color:var(--t1);padding:8px 18px;border-radius:var(--rx);
  font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s}
.btn-refresh:hover:not(:disabled){border-color:var(--indigo);background:var(--glass-hv);box-shadow:var(--glow-indigo)}
.btn-refresh:disabled{opacity:.5;cursor:not-allowed}
.btn-refresh.loading{animation:pulse-btn 1s ease-in-out infinite}
@keyframes pulse-btn{0%,100%{opacity:1}50%{opacity:.55}}

/* CARD */
.card {
  background: var(--bg3);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-b);
  border-radius: var(--r);
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
  transition: border-color .3s, transform .3s, box-shadow .3s;
  position: relative;
  overflow: hidden;
  animation: fadeUp .4s ease both;
}
.card::after {
  content: '';
  position: absolute;
  top: 0;
  left: 10%;
  right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.13), transparent);
  border-radius: 50%;
  pointer-events: none;
}
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--r);
  background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,0.045) 50%, transparent 65%);
  transform: translateX(-120%);
  transition: transform 0.65s ease;
  pointer-events: none;
  z-index: 0;
}
.card:hover::before {
  transform: translateX(120%);
}
.card:hover {
  border-color: var(--indigo);
  transform: scale(1.003);
  box-shadow: 0 12px 50px rgba(0,0,0,.65);
}
.card:nth-child(1){animation-delay:.04s}.card:nth-child(2){animation-delay:.08s}
.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.16s}
.card:nth-child(5){animation-delay:.20s}.card:nth-child(6){animation-delay:.24s}
.card:nth-child(7){animation-delay:.28s}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.card-hd-left{display:flex;align-items:center;gap:10px}
.card-icon{width:38px;height:38px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.ci-indigo{background:rgba(0,71,251,.18);box-shadow:var(--glow-indigo)}
.ci-green {background:rgba(0,230,118,.18);box-shadow:var(--glow-green)}
.ci-cyan  {background:rgba(0,174,239,.18);box-shadow:var(--glow-cyan)}
.ci-amber {background:rgba(255,179,0,.18);box-shadow:var(--glow-amber)}
.ci-red   {background:rgba(255,23,68,.18);box-shadow:var(--glow-red)}
.ci-purple{background:rgba(0,174,239,.18);box-shadow:0 0 12px rgba(0,174,239,.2)}
.card-title{font-size:15px;font-weight:700;letter-spacing:-.2px;font-family:'Outfit',sans-serif}
.card-subtitle{font-size:12px;color:var(--t3);margin-top:2px}

/* STATS GRID */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px;position:relative;z-index:1}
.stat-box{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--rs);
  padding:18px;text-align:center;transition:all .25s;position:relative}
.stat-box::before {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: var(--indigo);
  transform-origin: left center;
}
.stat-box:hover{transform:translateY(-3px);border-color:var(--indigo);box-shadow:var(--glow-indigo)}
.stat-val{font-size:30px;font-weight:800;letter-spacing:-1.5px;font-family:'Outfit',sans-serif}
.stat-lbl{font-size:11px;color:var(--t3);margin-top:5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.sv-indigo{background:linear-gradient(135deg,#0047FB,#00AEEF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sv-green {color:var(--green)} .sv-red{color:var(--red)} .sv-amber{color:var(--amber)} .sv-cyan{color:var(--cyan)}

/* TABLE */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table thead th{position:sticky;top:0;z-index:10;background:var(--bg2);padding:10px 14px;text-align:left;font-size:10px;font-weight:700;
  letter-spacing:.7px;text-transform:uppercase;color:var(--t3);
  border-bottom:1px solid var(--glass-b);white-space:nowrap}
.data-table tbody td{padding:13px 14px;border-bottom:1px solid rgba(255,255,255,.04);
  color:var(--t1);vertical-align:middle}
.data-table tbody tr{transition:background .15s}
.data-table tbody tr:hover{background:rgba(255,255,255,.035)}
.data-table tbody tr:last-child td{border-bottom:none}
.clickable-row{cursor:pointer}
/* v3: unified scroll container — same capped height on every dashboard table,
   framed so the scroll boundary is visible. Sticky thead + thin themed
   scrollbars are defined globally above. */
.table-wrap{overflow-x:auto;overflow-y:auto;max-height:480px;-webkit-overflow-scrolling:touch;
  border:1px solid var(--glass-b);border-radius:var(--rx);background:rgba(15,23,42,.2);
  scrollbar-width:thin;scrollbar-color:rgba(0,71,251,.3) var(--bg2)}
.table-wrap::-webkit-scrollbar{width:6px;height:6px}
.table-wrap::-webkit-scrollbar-track{background:var(--bg2);border-radius:var(--rx)}
.table-wrap::-webkit-scrollbar-thumb{background:rgba(0,71,251,.38);border-radius:4px}
.table-wrap::-webkit-scrollbar-thumb:hover{background:var(--t3)}

/* v3: CSV reconciliation upload zone */
.upload-zone{border:2px dashed var(--glass-b);border-radius:var(--rx);padding:30px;
  text-align:center;cursor:pointer;transition:all .3s;margin-bottom:20px;background:var(--glass)}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--indigo);background:var(--glass-hv);
  box-shadow:var(--glow-indigo)}

/* v3: reconciliation result tabs */
.recon-tabs{display:flex;gap:10px;margin-bottom:15px;border-bottom:1px solid var(--glass-b);padding-bottom:8px}
.recon-tabs .btn.active{border-color:var(--indigo);color:var(--t1);background:var(--glass-hv)}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:999px;
  font-size:11px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.b-green {background:rgba(16,185,129,.14);color:var(--green);border:1px solid rgba(16,185,129,.3);box-shadow:0 0 8px rgba(16,185,129,.2)}
.b-red   {background:rgba(239,68,68,.14); color:var(--red);  border:1px solid rgba(239,68,68,.3); box-shadow:0 0 8px rgba(239,68,68,.2)}
.b-amber {background:rgba(245,158,11,.14);color:var(--amber);border:1px solid rgba(245,158,11,.3);box-shadow:0 0 8px rgba(245,158,11,.2)}
.b-grey  {background:rgba(144,143,160,.12);color:var(--t3); border:1px solid rgba(144,143,160,.25)}
.b-indigo{background:rgba(0,71,251,.14);color:var(--indigo);border:1px solid rgba(0,71,251,.3);box-shadow:0 0 8px rgba(0,71,251,.2)}
.b-cyan  {background:rgba(0,174,239,.14); color:var(--cyan);  border:1px solid rgba(0,174,239,.3); box-shadow:0 0 8px rgba(0,174,239,.2)}
.b-purple{background:rgba(139,92,246,.14);color:var(--purple);border:1px solid rgba(139,92,246,.3);box-shadow:0 0 8px rgba(139,92,246,.2)}

/* STATUS DOT */
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-online {background:var(--green);box-shadow:0 0 10px rgba(16,185,129,.8);animation:pulse-g 2s infinite}
.dot-waiting{background:var(--cyan); box-shadow:0 0 8px rgba(0,174,239,.6); animation:pulse-c 2s infinite}
.dot-away   {background:var(--amber);box-shadow:0 0 7px rgba(245,158,11,.5)}
.dot-offline{background:var(--t4)}
.dot-stalled{background:var(--red);box-shadow:0 0 8px rgba(239,68,68,.7);animation:pulse-r 1.5s infinite}
.status-cell{display:flex;align-items:center;gap:8px;white-space:nowrap}
@keyframes pulse-g{0%,100%{box-shadow:0 0 4px rgba(16,185,129,.5)}50%{box-shadow:0 0 14px rgba(16,185,129,.95)}}
@keyframes pulse-c{0%,100%{box-shadow:0 0 4px rgba(0,174,239,.5)}50%{box-shadow:0 0 14px rgba(0,174,239,.95)}}
@keyframes pulse-r{0%,100%{box-shadow:0 0 4px rgba(239,68,68,.5)}50%{box-shadow:0 0 14px rgba(239,68,68,.95)}}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:none;
  border-radius:var(--rx);font-size:12px;font-weight:600;cursor:pointer;
  font-family:'Inter',sans-serif;transition:all .2s;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed!important;transform:none!important;box-shadow:none!important}
.btn-primary{background:linear-gradient(135deg,#0047FB,#00AEEF);color:#fff;box-shadow:0 2px 12px rgba(0,71,251,.35)}
.btn-primary:hover:not(:disabled){opacity:.9;box-shadow:var(--glow-indigo);transform:translateY(-1px)}
.btn-cyan{background:linear-gradient(135deg,#00AEEF,#0047FB);color:#fff;box-shadow:0 2px 10px rgba(0,174,239,.3)}
.btn-cyan:hover:not(:disabled){opacity:.9;box-shadow:var(--glow-cyan);transform:translateY(-1px)}
.btn-green{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 2px 10px rgba(16,185,129,.3)}
.btn-green:hover:not(:disabled){opacity:.9;box-shadow:var(--glow-green);transform:translateY(-1px)}
.btn-red{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn-red:hover:not(:disabled){opacity:.9;transform:translateY(-1px)}
.btn-amber{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;box-shadow:0 2px 10px rgba(245,158,11,.3)}
.btn-amber:hover:not(:disabled){opacity:.9;box-shadow:0 0 14px rgba(245,158,11,.6);transform:translateY(-1px)}
.btn-ghost{background:var(--glass);border:1px solid var(--glass-b);color:var(--t2)}
.btn-ghost:hover:not(:disabled){border-color:var(--indigo);color:var(--t1);background:var(--glass-hv)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-queued{background:rgba(16,185,129,.14);border:1px solid rgba(16,185,129,.35);color:var(--green);pointer-events:none}
.btn-pinged{background:rgba(0,174,239,.14); border:1px solid rgba(0,174,239,.35); color:var(--cyan); pointer-events:none}
.action-cell{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* PROGRESS TRACKER */
.prog-row td{padding:0!important;border-bottom:1px solid rgba(255,255,255,.04)}
.prog-inner{display:none;padding:18px 22px;background:rgba(0,71,251,.06);
  border-top:1px solid rgba(0,71,251,.18)}
.prog-inner.open{display:block;animation:fadeIn .25s ease}
.prog-steps{display:flex;align-items:center;margin-bottom:10px}
.prog-step{display:flex;align-items:center;gap:7px}
.prog-icon{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:14px;
  background:rgba(255,255,255,.05);border:1px solid var(--glass-b);
  color:var(--t3);position:relative;z-index:1;transition:all .4s}
.prog-icon.active{background:rgba(0,71,251,.25);border-color:var(--indigo);color:var(--indigo);box-shadow:var(--glow-indigo)}
.prog-icon.done  {background:rgba(16,185,129,.2);border-color:var(--green); color:var(--green); box-shadow:var(--glow-green)}
.prog-icon.error {background:rgba(239,68,68,.2); border-color:var(--red);   color:var(--red);   box-shadow:var(--glow-red)}
.prog-icon.spinning::after{content:'';position:absolute;inset:-4px;border-radius:50%;
  border:2px solid transparent;border-top-color:var(--indigo);animation:spin .75s linear infinite}
.prog-connector{flex:1;height:2px;background:rgba(255,255,255,.08);margin:0 6px;min-width:24px;position:relative;overflow:hidden}
.prog-fill{height:100%;width:0;background:linear-gradient(90deg,#0047FB,#00AEEF);transition:width .6s ease}
.prog-fill.done{width:100%}
.prog-labels{display:flex;align-items:center;font-size:10px;font-weight:600;letter-spacing:.3px;color:var(--t3);text-transform:uppercase}
.prog-lbl{flex:1;text-align:center}
.prog-lbl:first-child{text-align:left}
.prog-lbl:last-child{text-align:right;flex:0;min-width:48px}
.prog-lbl.active{color:var(--indigo)}.prog-lbl.done{color:var(--green)}.prog-lbl.error{color:var(--red)}
.prog-msg{font-size:11px;color:var(--t3);margin-top:7px}
.prog-countdown{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cyan);
  margin-top:5px;display:inline-flex;align-items:center;gap:5px}
.prog-countdown::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--cyan);animation:pulse-c 1.5s infinite}

/* TIMELINE */
.timeline-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tl-filter{padding:4px 12px;border-radius:999px;font-size:11px;font-weight:600;
  cursor:pointer;border:1px solid var(--glass-b);background:var(--glass);color:var(--t3);
  transition:all .2s}
.tl-filter.active,.tl-filter:hover{border-color:var(--indigo);color:var(--indigo);background:rgba(0,71,251,.1)}
.timeline{padding:4px 0}
.tl-item{display:flex;gap:14px;padding:11px 0 11px 22px;border-left:2px solid rgba(255,255,255,.07);
  margin-left:8px;position:relative;animation:fadeLeft .2s ease both}
.tl-item::before{content:'';position:absolute;left:-5px;top:18px;width:8px;height:8px;
  border-radius:50%;background:var(--t4);border:2px solid var(--bg2)}
.tl-item.tl-success::before  {background:var(--green); box-shadow:var(--glow-green)}
.tl-item.tl-failure::before  {background:var(--red);   box-shadow:var(--glow-red)}
.tl-item.tl-heartbeat::before,.tl-item.tl-waiting::before{background:var(--cyan)}
.tl-item.tl-pong::before     {background:var(--cyan)}
.tl-item.tl-generate::before {background:var(--indigo);box-shadow:var(--glow-indigo)}
.tl-item.tl-upload::before   {background:var(--purple)}
.tl-item.tl-ack::before      {background:var(--indigo);box-shadow:var(--glow-indigo)}
.tl-item.tl-registered::before{background:var(--green);box-shadow:var(--glow-green)}
.tl-item.tl-updated::before  {background:var(--amber); box-shadow:var(--glow-amber)}
.tl-ts{font-size:11px;color:var(--t3);white-space:nowrap;min-width:140px;flex-shrink:0;
  font-family:'JetBrains Mono',monospace;padding-top:2px;cursor:help}
.tl-body{flex:1}
.tl-msg{font-size:12px;color:var(--t3);margin-top:4px;word-break:break-word;
  font-family:'JetBrains Mono',monospace;background:rgba(255,255,255,.03);
  padding:4px 8px;border-radius:4px;border-left:2px solid var(--t4)}

/* MODAL */
.modal{display:none;position:fixed;z-index:9000;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(5px)}
.modal.open{display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease}
.modal-box{background:var(--bg2);border:1px solid var(--glass-b);border-radius:var(--r);
  width:100%;max-width:700px;max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 28px 90px rgba(0,0,0,.75);animation:slideUp .25s ease}
.modal-hd{display:flex;align-items:center;justify-content:space-between;
  padding:20px 26px;border-bottom:1px solid var(--glass-b);flex-shrink:0}
.modal-hd h2{font-size:15px;font-weight:700}
.modal-close{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;background:var(--glass);border:none;color:var(--t2);
  cursor:pointer;font-size:16px;transition:all .2s}
.modal-close:hover{background:rgba(239,68,68,.2);color:var(--red)}
.modal-body{padding:20px 26px;overflow-y:auto;flex:1}

/* SPLIT VIEW */
.split-view{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.split-pane{background:rgba(255,255,255,.02);border:1px solid var(--glass-b);
  border-radius:var(--rs);padding:16px;max-height:340px;overflow-y:auto}
.split-pane h3{font-size:10px;font-weight:700;color:var(--t3);margin-bottom:12px;
  text-transform:uppercase;letter-spacing:.7px}

/* DEV LISTS */
.dev-list{list-style:none}
.dev-list li{padding:8px 10px;border-radius:8px;margin-bottom:3px;font-size:13px;
  display:flex;align-items:center;justify-content:space-between;transition:background .15s}
.dev-list li:hover{background:rgba(255,255,255,.04)}
.dev-name{color:var(--t2)}.dev-date{font-size:11px;color:var(--t3)}.unreg{color:var(--red)!important}
.dev-chip{display:flex;align-items:center;justify-content:space-between;
  padding:9px 14px;background:var(--glass);border:1px solid var(--glass-b);
  border-radius:var(--rx);margin-bottom:6px;font-size:13px;transition:all .2s}
.dev-chip:hover{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.04)}
.dev-chip-rm{background:none;border:none;color:var(--t3);cursor:pointer;font-size:18px;
  line-height:1;padding:0 2px;transition:color .2s;font-family:sans-serif}
.dev-chip-rm:hover{color:var(--red)}
.manage-add{display:flex;gap:10px;margin-bottom:14px}
.manage-add input{flex:1}

/* INPUTS */
/* v5: email/url/textarea share the text-input treatment so the user-management
   forms match the rest of the dashboard rather than falling back to UA styles. */
input[type="text"],input[type="email"],input[type="url"],textarea,select{
  background:var(--glass);border:1px solid var(--glass-b);
  color:var(--t1);padding:9px 13px;border-radius:var(--rx);
  font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:all .2s}
input[type="text"]:focus,input[type="email"]:focus,input[type="url"]:focus,textarea:focus,select:focus{
  border-color:var(--indigo);background:var(--glass-hv);box-shadow:0 0 0 3px rgba(0,71,251,.15)}
input[type="text"]::placeholder,input[type="email"]::placeholder,
input[type="url"]::placeholder,textarea::placeholder{color:var(--t3)}
select option{background:var(--bg2);color:var(--t1)}
textarea{resize:vertical;min-height:90px;line-height:1.55;width:100%}

/* v5: USER MANAGEMENT FORMS */
.u-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.u-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.u-field.u-wide{grid-column:1/-1}
.u-label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--t3)}
.u-hint{font-size:11px;color:var(--t3);line-height:1.5}
.u-check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t2);cursor:pointer}
.u-check input{accent-color:var(--indigo);width:15px;height:15px;cursor:pointer}
.u-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.u-collapse{display:none;margin-top:12px}
.u-collapse.open{display:block}
/* v5.4: report-search quick-range buttons. Wraps so it degrades gracefully on a
   narrow window instead of overflowing the card. */
.rs-presets{display:flex;gap:8px;flex-wrap:wrap}
/* Date inputs are native controls, so they inherit the browser's light styling
   and become unreadable on the dark themes unless forced. color-scheme also
   recolours the picker icon and popup. */
.u-field input[type="date"]{color-scheme:dark}
@media(max-width:640px){.u-form{grid-template-columns:1fr}}

/* FORMS */
.admin-form{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.admin-form select{min-width:200px}
.test-form{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.test-form input[type="text"]{min-width:150px}

/* CONFIRM DIALOG */
.confirm-overlay{display:none;position:fixed;inset:0;z-index:9500;
  background:rgba(0,0,0,.75);backdrop-filter:blur(4px);
  align-items:center;justify-content:center;padding:20px}
.confirm-overlay.open{display:flex;animation:fadeIn .15s ease}
.confirm-box{background:var(--bg2);border:1px solid rgba(239,68,68,.35);border-radius:var(--r);
  padding:28px 32px;max-width:400px;width:100%;box-shadow:0 20px 70px rgba(0,0,0,.7),var(--glow-red);
  animation:slideUp .2s ease;text-align:center}
.confirm-box h3{font-size:16px;font-weight:700;margin-bottom:8px}
.confirm-box p{font-size:13px;color:var(--t2);margin-bottom:22px;line-height:1.6}
.confirm-actions{display:flex;gap:10px;justify-content:center}

/* LOADER */
.loader-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:80px 20px}
.loader-ring{width:48px;height:48px;border-radius:50%;
  border:3px solid rgba(0,71,251,.2);border-top-color:var(--indigo);
  animation:spin .9s linear infinite;box-shadow:var(--glow-indigo)}
.loader-text{font-size:14px;color:var(--t3)}

/* EMPTY STATE */
.empty-state{text-align:center;padding:36px 20px;color:var(--t3);font-size:13px}

/* TOAST */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--bg3);border:1px solid var(--glass-b);color:var(--t1);
  padding:13px 24px;border-radius:12px;font-size:13px;z-index:9999;
  transition:transform .3s cubic-bezier(.175,.885,.32,1.275);
  pointer-events:none;white-space:nowrap;max-width:92vw;
  box-shadow:0 8px 40px rgba(0,0,0,.55)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{border-color:rgba(239,68,68,.45);background:rgba(30,10,10,.9);box-shadow:var(--glow-red)}
#toast.ok{border-color:rgba(16,185,129,.4);box-shadow:var(--glow-green)}

/* ANIMATIONS */
@keyframes fadeIn  {from{opacity:0}to{opacity:1}}
@keyframes fadeUp  {from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeLeft{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes slideUp {from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
@keyframes spin    {to{transform:rotate(360deg)}}

/* RESPONSIVE */
@media(max-width:860px){
  .split-view{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .header{flex-direction:column;align-items:flex-start}
  .data-table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
}
@media(max-width:560px){
  .action-cell{flex-wrap:wrap}
  .manage-add{flex-direction:column}
  .admin-form,.test-form{flex-direction:column;align-items:stretch}
  .confirm-actions{flex-direction:column}
  .page-wrap{padding:16px 14px 80px}
}
/* VERSION MATRIX */
.vm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.vm-card{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;transition:all .3s;animation:fadeUp .3s ease both}
.vm-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.15);box-shadow:0 12px 40px rgba(0,0,0,.4)}
.vm-card-hd{display:flex;justify-content:space-between;align-items:flex-start}
.vm-dev-name{font-size:15px;font-weight:700;color:var(--t1)}
.vm-dev-status{font-size:11px;color:var(--t3);margin-top:2px}
.version-badge{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;border:1px solid}
.version-badge-ok{background:rgba(16,185,129,.15);color:var(--green);border-color:rgba(16,185,129,.4);box-shadow:var(--glow-green)}
.version-badge-warn{background:rgba(245,158,11,.15);color:var(--amber);border-color:rgba(245,158,11,.4);box-shadow:var(--glow-amber)}
.version-badge-err{background:rgba(239,68,68,.15);color:var(--red);border-color:rgba(239,68,68,.4);box-shadow:var(--glow-red)}
.hotpatch-btn{width:100%;padding:10px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.4);color:var(--amber);border-radius:var(--rx);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:auto}
.hotpatch-btn:hover{background:var(--amber);color:#fff;box-shadow:var(--glow-amber)}
.hotpatch-btn:disabled{opacity:0.5;cursor:not-allowed;background:transparent;color:var(--t3);border-color:var(--glass-b);box-shadow:none}

/* =========================================================
   THEME SYSTEM &#8212; overrides every surface, text, glow token
   ========================================================= */

/* -- Obsidian Emerald ------------------------------------ */
body[data-theme="emerald"] {
  --bg:    #031a19; --bg2: #041f1e; --bg3: #063330;
  --glass:    rgba(16,185,129,0.06);
  --glass-b:  rgba(16,185,129,0.14);
  --glass-hv: rgba(16,185,129,0.10);
  --indigo: #10b981; --purple: #34d399;
  --cyan:   #059669; --green:  #6ee7b7;
  --amber:  #fbbf24; --red:    #f87171;
  --t1: #ecfdf5; --t2: #a7f3d0; --t3: #6ee7b7; --t4: #2d6a4f;
  --shadow: 0 8px 40px rgba(0,0,0,.65);
  --glow-indigo: 0 0 24px rgba(16,185,129,.40);
  --glow-green:  0 0 16px rgba(110,231,183,.35);
  --glow-red:    0 0 16px rgba(248,113,113,.30);
  --glow-amber:  0 0 16px rgba(251,191,36,.30);
  --glow-cyan:   0 0 16px rgba(5,150,105,.30);
  --sidebar-bg:  rgba(3,26,25,.95);
  --topbar-bg:   rgba(3,26,25,.75);
}
body[data-theme="emerald"]::before {
  background:
    radial-gradient(ellipse at 10% 5%,  rgba(16,185,129,.22) 0%,transparent 50%),
    radial-gradient(ellipse at 85% 80%, rgba(52,211,153,.16) 0%,transparent 50%),
    radial-gradient(ellipse at 50% 45%, rgba(6,51,48,.12)    0%,transparent 45%);
}

/* -- Sapphire Synthwave ---------------------------------- */
body[data-theme="synthwave"] {
  --bg:    #120829; --bg2: #0d0520; --bg3: #1a0d38;
  --glass:    rgba(236,72,153,0.06);
  --glass-b:  rgba(168,85,247,0.18);
  --glass-hv: rgba(168,85,247,0.11);
  --indigo: #a855f7; --purple: #ec4899;
  --cyan:   #38bdf8; --green:  #4ade80;
  --amber:  #fb923c; --red:    #f87171;
  --t1: #fdf4ff; --t2: #e9d5ff; --t3: #c084fc; --t4: #581c87;
  --shadow: 0 8px 40px rgba(0,0,0,.75);
  --glow-indigo: 0 0 28px rgba(168,85,247,.50);
  --glow-green:  0 0 16px rgba(74,222,128,.35);
  --glow-red:    0 0 16px rgba(248,113,113,.30);
  --glow-amber:  0 0 16px rgba(251,146,60,.35);
  --glow-cyan:   0 0 16px rgba(56,189,248,.40);
  --sidebar-bg:  rgba(13,5,32,.97);
  --topbar-bg:   rgba(13,5,32,.80);
}
body[data-theme="synthwave"]::before {
  background:
    radial-gradient(ellipse at 8%  3%,  rgba(168,85,247,.28) 0%,transparent 52%),
    radial-gradient(ellipse at 90% 85%, rgba(236,72,153,.20) 0%,transparent 52%),
    radial-gradient(ellipse at 50% 50%, rgba(56,189,248,.06) 0%,transparent 45%);
}

/* -- Obsidian Glass -------------------------------------- */
body[data-theme="glass"] {
  --bg:    #06080f; --bg2: #0b0e18; --bg3: #111827;
  --glass:    rgba(255,255,255,0.04);
  --glass-b:  rgba(255,255,255,0.10);
  --glass-hv: rgba(255,255,255,0.07);
  --indigo: #93c5fd; --purple: #c4b5fd;
  --cyan:   #67e8f9; --green:  #86efac;
  --amber:  #fde68a; --red:    #fca5a5;
  --t1: #f8fafc; --t2: #e2e8f0; --t3: #94a3b8; --t4: #334155;
  --shadow: 0 8px 40px rgba(0,0,0,.80);
  --glow-indigo: 0 0 20px rgba(147,197,253,.25);
  --glow-green:  0 0 16px rgba(134,239,172,.25);
  --glow-red:    0 0 16px rgba(252,165,165,.25);
  --glow-amber:  0 0 16px rgba(253,230,138,.25);
  --glow-cyan:   0 0 16px rgba(103,232,249,.25);
  --sidebar-bg:  rgba(6,8,15,.97);
  --topbar-bg:   rgba(6,8,15,.80);
}
body[data-theme="glass"]::before {
  background:
    radial-gradient(ellipse at 12% 5%,  rgba(255,255,255,.04) 0%,transparent 50%),
    radial-gradient(ellipse at 88% 82%, rgba(255,255,255,.03) 0%,transparent 50%),
    radial-gradient(ellipse at 55% 42%, rgba(255,255,255,.02) 0%,transparent 45%);
}

/* Apply sidebar bg & topbar bg from theme vars where hardcoded */
body[data-theme] .sidebar        { background: var(--sidebar-bg,rgba(15,23,42,.92)); }
body[data-theme] .top-bar        { background: var(--topbar-bg, rgba(15,23,42,.60)); }
/* Active nav item picks up --indigo correctly in all themes */
body[data-theme] .nav-item.active {
  background: rgba(0,0,0,.20);
  color: var(--indigo);
  border-color: var(--glass-b);
  box-shadow: none;
}

/* THEME PILL BUTTONS */
.theme-switcher {
  padding: 10px 14px;
  border-top: 1px solid var(--glass-b);
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.theme-switcher-label {
  font-size: 9px;
  font-weight: 700;
  color: var(--t4);
  text-transform: uppercase;
  letter-spacing: .8px;
}
.theme-pills {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}
.theme-pill {
  flex: 1;
  min-width: 0;
  padding: 5px 6px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--glass-b);
  background: var(--glass);
  color: var(--t3);
  font-family: 'Inter', sans-serif;
  transition: all .2s;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.theme-pill:hover { color: var(--t1); border-color: var(--indigo); background: var(--glass-hv); }
.theme-pill.active {
  background: var(--indigo);
  color: #fff;
  border-color: transparent;
  box-shadow: var(--glow-indigo);
}
/* Colour-coded pill accents on hover */
.theme-pill[data-theme="emerald"]:hover  { border-color: #10b981; color: #10b981; }
.theme-pill[data-theme="synthwave"]:hover { border-color: #a855f7; color: #a855f7; }
.theme-pill[data-theme="glass"]:hover     { border-color: #93c5fd; color: #93c5fd; }
.theme-pill[data-theme="default"]:hover   { border-color: #0047FB; color: #0047FB; }

/* Responsive: hide pill labels on narrow sidebar */
@media(max-width:860px) {
  .theme-switcher { display: none; }
}

/* ==========================================================================
   &#55356;&#57100; AMBIENT BACKGROUND LAYER
   ========================================================================== */
body {
  position: relative;
  z-index: 1;
}
.app-shell {
  position: relative;
  z-index: 2;
}

.ambient-background {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
  animation: meshDrift 40s ease-in-out infinite;
}

.ambient-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(140px);
  opacity: 0.15;
  mix-blend-mode: screen;
}

.orb-1 {
  top: -10%;
  left: 20%;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, var(--indigo) 0%, rgba(0,0,0,0) 70%);

/* ==========================================================================
   &#10024; FLOATING PARTICLE FIELD
   ========================================================================== */
.particle-field {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.particle-field span {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.55);
  animation: particleDrift linear infinite;
}

/* 18 particles &#8212; varied size, position, speed */
.particle-field span:nth-child(1)  { width:2px; height:2px; left:8%;   bottom:5%;  animation-duration:28s; animation-delay:0s;  }
.particle-field span:nth-child(2)  { width:3px; height:3px; left:15%;  bottom:10%; animation-duration:22s; animation-delay:-4s; background:rgba(99,179,237,0.6); }
.particle-field span:nth-child(3)  { width:2px; height:2px; left:22%;  bottom:3%;  animation-duration:35s; animation-delay:-9s; }
.particle-field span:nth-child(4)  { width:4px; height:4px; left:33%;  bottom:8%;  animation-duration:18s; animation-delay:-2s; background:rgba(167,139,250,0.5); }
.particle-field span:nth-child(5)  { width:2px; height:2px; left:42%;  bottom:2%;  animation-duration:30s; animation-delay:-7s; }
.particle-field span:nth-child(6)  { width:3px; height:3px; left:51%;  bottom:15%; animation-duration:24s; animation-delay:-12s; background:rgba(52,211,153,0.5); }
.particle-field span:nth-child(7)  { width:2px; height:2px; left:60%;  bottom:6%;  animation-duration:38s; animation-delay:-1s; }
.particle-field span:nth-child(8)  { width:3px; height:3px; left:68%;  bottom:12%; animation-duration:20s; animation-delay:-5s; background:rgba(99,179,237,0.6); }
.particle-field span:nth-child(9)  { width:2px; height:2px; left:75%;  bottom:4%;  animation-duration:32s; animation-delay:-16s; }
.particle-field span:nth-child(10) { width:4px; height:4px; left:82%;  bottom:9%;  animation-duration:25s; animation-delay:-3s; background:rgba(245,158,11,0.4); }
.particle-field span:nth-child(11) { width:2px; height:2px; left:89%;  bottom:7%;  animation-duration:42s; animation-delay:-20s; }
.particle-field span:nth-child(12) { width:3px; height:3px; left:12%;  bottom:25%; animation-duration:33s; animation-delay:-8s; background:rgba(167,139,250,0.5); }
.particle-field span:nth-child(13) { width:2px; height:2px; left:28%;  bottom:40%; animation-duration:19s; animation-delay:-14s; }
.particle-field span:nth-child(14) { width:3px; height:3px; left:45%;  bottom:30%; animation-duration:27s; animation-delay:-6s; background:rgba(52,211,153,0.5); }
.particle-field span:nth-child(15) { width:2px; height:2px; left:58%;  bottom:45%; animation-duration:36s; animation-delay:-11s; }
.particle-field span:nth-child(16) { width:4px; height:4px; left:72%;  bottom:35%; animation-duration:21s; animation-delay:-18s; background:rgba(99,179,237,0.4); }
.particle-field span:nth-child(17) { width:2px; height:2px; left:85%;  bottom:50%; animation-duration:44s; animation-delay:-10s; }
.particle-field span:nth-child(18) { width:3px; height:3px; left:38%;  bottom:60%; animation-duration:23s; animation-delay:-15s; background:rgba(245,158,11,0.3); }

/* ==========================================================================
   &#9203; PREMIUM LOADING SCREEN
   ========================================================================== */
#loading {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  z-index: 10000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  transition: opacity 0.4s ease;
}

#loading.hidden {
  opacity: 0;
  pointer-events: none;
}

.loader-rings {
  position: relative;
  width: 320px;
  height: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 2.5rem;
}

.ring {
  position: absolute;
  border-radius: 50%;
  border: 2px solid var(--indigo);
}

.ring-1 {
  width: 180px;
  height: 180px;
  --ring-opacity: 0.95;
  border-width: 2.5px;
  animation: ringPulse 2s 0.0s ease-in-out infinite;
}

.ring-2 {
  width: 250px;
  height: 250px;
  --ring-opacity: 0.6;
  border-color: var(--purple);
  border-width: 2.5px;
  animation: ringPulse 2s 0.32s ease-in-out infinite;
}

.ring-3 {
  width: 320px;
  height: 320px;
  --ring-opacity: 0.3;
  border-color: var(--green);
  border-width: 2.5px;
  animation: ringPulse 2s 0.64s ease-in-out infinite;
}

.ring-icon {
  position: relative;
  z-index: 2;
  animation: float 3s ease-in-out infinite;
}

.logo-badge {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: rgba(8, 11, 20, 0.76);
  border: 1.5px solid rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  box-shadow: 0 16px 48px 0 rgba(0, 0, 0, 0.7);
}

.logo-badge img {
  width: 100%;
  height: auto;
  max-height: 48px;
  object-fit: contain;
  filter: brightness(0) invert(1);
}

.loader-bar {
  width: 360px;
  height: 6px;
  background: rgba(255,255,255,0.05);
  border-radius: 100px;
  overflow: hidden;
  position: relative;
  margin-bottom: 1.5rem;
}

.loader-progress {
  width: 40%;
  height: 100%;
  background: var(--indigo);
  border-radius: 100px;
  position: absolute;
  left: 0;
  top: 0;
  animation: loadingAnim 1.5s ease-in-out infinite;
}

#loading .loader-text {
  font-size: 16px;
  color: var(--t2);
  letter-spacing: 0.8px;
  font-weight: 500;
  font-family: 'Outfit', sans-serif;
  text-transform: uppercase;
}

/* Override old simple loader styles since they conflict */
.loader-wrap { display: none !important; }
.loader-ring  { display: none !important; }

/* ==========================================================================
   &#10024; ENHANCED ACTIVE NAV ITEM
   ========================================================================== */
.nav-item.active {
  animation: breathGlow 3s ease-in-out infinite alternate;
  position: relative;
}

.nav-item.active::after {
  content: '';
  position: absolute;
  left: -1px;
  top: 18%;
  bottom: 18%;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--indigo);
  box-shadow: 0 0 10px var(--indigo), 0 0 20px rgba(0,71,251,0.35);
  animation: navBarIn 0.3s cubic-bezier(0.4,0,0.2,1) both;
}

/* ==========================================================================
   &#55357;&#56523; STAGGERED TABLE ROW SLIDE-IN
   ========================================================================== */
.data-table tbody tr {
  opacity: 0;
  transform: translateY(12px);
  animation: slideInRow 0.5s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
}

.data-table tbody tr:nth-child(1)  { animation-delay: 0.04s; }
.data-table tbody tr:nth-child(2)  { animation-delay: 0.08s; }
.data-table tbody tr:nth-child(3)  { animation-delay: 0.12s; }
.data-table tbody tr:nth-child(4)  { animation-delay: 0.16s; }
.data-table tbody tr:nth-child(5)  { animation-delay: 0.20s; }
.data-table tbody tr:nth-child(6)  { animation-delay: 0.24s; }
.data-table tbody tr:nth-child(7)  { animation-delay: 0.28s; }
.data-table tbody tr:nth-child(8)  { animation-delay: 0.32s; }
.data-table tbody tr:nth-child(9)  { animation-delay: 0.36s; }
.data-table tbody tr:nth-child(10) { animation-delay: 0.40s; }

/* ==========================================================================
   &#55356;&#57260; ALL NEW KEYFRAMES
   ========================================================================== */
@keyframes ambientFloat {
  0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
  50%  { transform: translate(80px, -60px) scale(1.15) rotate(180deg); }
  100% { transform: translate(-40px, 80px) scale(0.9) rotate(360deg); }
}

@keyframes meshDrift {
  0%   { filter: hue-rotate(0deg) brightness(1); }
  50%  { filter: hue-rotate(18deg) brightness(1.05); }
  100% { filter: hue-rotate(0deg) brightness(1); }
}

@keyframes particleDrift {
  0%   { transform: translateY(0) translateX(0);   opacity: 0; }
  8%   { opacity: 0.55; }
  90%  { opacity: 0.35; }
  100% { transform: translateY(-105vh) translateX(45px); opacity: 0; }
}

@keyframes ringPulse {
  0%, 100% { transform: scale(1);    opacity: var(--ring-opacity, 0.8); }
  50%       { transform: scale(1.18); opacity: calc(var(--ring-opacity, 0.8) * 0.3); }
}

@keyframes navBarIn {
  from { transform: scaleY(0); }
  to   { transform: scaleY(1); }
}

@keyframes breathGlow {
  0%   { box-shadow: 0 0 10px rgba(0,71,251,0.1), inset 0 0 5px rgba(0,71,251,0.1);  border-color: rgba(0,71,251,0.2); }
  100% { box-shadow: 0 0 22px rgba(0,71,251,0.3), inset 0 0 10px rgba(0,71,251,0.15); border-color: rgba(0,71,251,0.45); }
}

@keyframes slideInRow {
  to { opacity: 1; transform: translateY(0); }
}

@keyframes float {
  0%   { transform: translateY(0px); }
  50%  { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}

@keyframes loadingAnim {
  0%   { left: -40%; width: 40%; }
  50%  { width: 60%; }
  100% { left: 100%; width: 40%; }
}

@keyframes pageEnter {
  from { opacity: 0; transform: translateY(18px) scale(0.994); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* Page enter animation on page-view switch */
.page-view.active {
  animation: pageEnter 0.42s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

/* ==========================================================================
   &#55357;&#56744;&#65039; PRINT
   ========================================================================== */
@media print {
  .ambient-background, #loading { display: none !important; }
  .app-shell { position: static; }
}

/* &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472; v2 ADDITIONS &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472; */

/* Mobile hamburger &#8212; visible only when the sidebar is in its collapsed/hidden state */
.mobile-menu-btn { padding: 4px 10px; font-size: 18px; line-height: 1; }
@media (max-width: 720px) {
  .mobile-menu-btn { display: inline-flex !important; }
  /* Slide the sidebar fully off-screen by default at this width */
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: 8500;
    width: 240px !important;
    box-shadow: 8px 0 32px rgba(0,0,0,0.4);
  }
  .sidebar.mobile-open { transform: translateX(0); }
  .sidebar.mobile-open .sidebar-brand-text,
  .sidebar.mobile-open .sidebar-brand-sub,
  .sidebar.mobile-open .nav-item span:not(.nav-icon),
  .sidebar.mobile-open .nav-label,
  .sidebar.mobile-open .sidebar-footer span { display: inline !important; }
  .sidebar.mobile-open .sidebar-brand { justify-content: flex-start; padding: 20px 18px; }
  .sidebar.mobile-open .sidebar-brand img { width: auto; max-width: 160px; height: 40px; }
  .main-area { margin-left: 0 !important; width: 100% !important; }
  .kpi-strip { grid-template-columns: 1fr 1fr !important; }
}

/* ==========================================================================
   LIGHT THEME OVERRIDES  (added 2026-07-31)
   --------------------------------------------------------------------------
   The rules above were authored for a near-black background and hardcode a
   number of dark-only assumptions that CSS variables alone cannot fix:
   white-on-white sheen highlights, screen-blend glow orbs, light-coloured
   particles, and a dark loading screen. Everything in this block exists
   solely to correct those for the light surface — it is intentionally last
   so it wins on equal specificity.
   ========================================================================== */

/* -- Card sheen: was a WHITE top highlight + white diagonal sweep, both of
      which are invisible on white. Use a faint dark edge instead. --------- */
.card::after {
  background: linear-gradient(90deg, transparent, rgba(15,23,42,0.07), transparent);
}
.card::before {
  background: linear-gradient(105deg, transparent 35%, rgba(15,23,42,0.028) 50%, transparent 65%);
}
.card:hover {
  border-color: rgba(0,71,251,.34);
  box-shadow: 0 2px 4px rgba(15,23,42,.05), 0 14px 38px rgba(15,23,42,.11);
}
.kpi-card:hover {
  border-color: rgba(0,71,251,.30);
  box-shadow: 0 2px 4px rgba(15,23,42,.05), 0 10px 26px rgba(15,23,42,.10);
}
.vm-card:hover {
  border-color: rgba(0,71,251,.30);
  box-shadow: 0 2px 4px rgba(15,23,42,.05), 0 12px 30px rgba(15,23,42,.10);
}
.data-table tbody tr:hover { background: rgba(0,71,251,.045); }

/* -- Ambient orbs: mix-blend-mode:screen makes anything invisible on white
      (screen against white === white). Switch to multiply so the brand tint
      actually darkens the page slightly, and cut the intensity right down. */
.ambient-orb {
  mix-blend-mode: multiply;
  opacity: 0.055;
  filter: blur(120px);
}
.orb-1 { background: radial-gradient(circle, #0047FB 0%, rgba(255,255,255,0) 70%); }
.orb-2 { background: radial-gradient(circle, #0087BD 0%, rgba(255,255,255,0) 70%); }
.orb-3 { background: radial-gradient(circle, #0047FB 0%, rgba(255,255,255,0) 70%); }
.orb-4 { background: radial-gradient(circle, #0087BD 0%, rgba(255,255,255,0) 70%); }
.orb-5 { background: radial-gradient(circle, #0047FB 0%, rgba(255,255,255,0) 70%); }
/* meshDrift's hue-rotate on a light page reads as a colour wobble — drop it. */
.ambient-background { animation: none; }

/* -- Particles were white-on-dark. On white they must be dark, and far
      fainter, or they look like dust on the screen. --------------------- */
.particle-field span,
.particle-field span:nth-child(n) {
  background: rgba(15,23,42,0.10) !important;
}

/* -- Loading screen: was dark bg + logo forced to pure white via
      brightness(0) invert(1), which would vanish on a white panel. ------ */
#loading { background: var(--bg); }
.logo-badge {
  background: linear-gradient(135deg,#0b1220,#132038);   /* keep logo legible */
  border: 1px solid rgba(15,23,42,0.10);
  box-shadow: 0 10px 34px rgba(15,23,42,0.16);
}
.logo-badge img { filter: none; }                        /* logo is already light-on-dark here */
.loader-bar { background: rgba(15,23,42,0.07); }

/* -- Table + scroll chrome ------------------------------------------------ */
.table-wrap { background: #ffffff; }
.data-table thead th { background: #f8fafc; }
* { scrollbar-color: rgba(15,23,42,.26) transparent; }
::-webkit-scrollbar-track,
.table-wrap::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb,
.table-wrap::-webkit-scrollbar-thumb { background: rgba(15,23,42,.24); }
::-webkit-scrollbar-thumb:hover,
.table-wrap::-webkit-scrollbar-thumb:hover { background: rgba(15,23,42,.38); }

/* -- Sidebar / nav ------------------------------------------------------- */
.nav-item.active {
  background: rgba(0,71,251,.075);
  color: var(--indigo);
  border-color: rgba(0,71,251,.22);
  box-shadow: none;
  animation: none;                    /* the dark theme's breathing glow reads as flicker on white */
}
.nav-item.active::after { box-shadow: none; }
.sidebar-footer .sync-dot { animation: none; box-shadow: none; }

/* -- Status dots: the dark theme's heavy bloom smears on white ----------- */
.dot-online, .dot-waiting, .dot-away, .dot-offline, .dot-stalled {
  animation: none !important;
  box-shadow: 0 0 0 2px rgba(15,23,42,.05) !important;
}
.dot-offline { background: var(--t4); }

/* -- Badges / chips need more fill opacity to read on white ------------- */
.b-green {background:rgba(5,150,105,.10); border-color:rgba(5,150,105,.30); box-shadow:none}
.b-red   {background:rgba(220,38,38,.10); border-color:rgba(220,38,38,.30); box-shadow:none}
.b-amber {background:rgba(180,83,9,.10);  border-color:rgba(180,83,9,.30);  box-shadow:none}
.b-grey  {background:rgba(15,23,42,.05);  border-color:rgba(15,23,42,.16)}
.b-indigo{background:rgba(0,71,251,.09);  border-color:rgba(0,71,251,.28);  box-shadow:none}
.b-cyan  {background:rgba(0,135,189,.09); border-color:rgba(0,135,189,.28); box-shadow:none}
.b-purple{background:rgba(0,135,189,.09); border-color:rgba(0,135,189,.28); box-shadow:none}
.version-badge-ok   {box-shadow:none;background:rgba(5,150,105,.10);border-color:rgba(5,150,105,.35)}
.version-badge-warn {box-shadow:none;background:rgba(180,83,9,.10); border-color:rgba(180,83,9,.35)}
.version-badge-err  {box-shadow:none;background:rgba(220,38,38,.10);border-color:rgba(220,38,38,.35)}

/* -- Buttons: flat brand fills read better than glowing gradients here -- */
.btn-primary { background: var(--indigo); box-shadow: 0 1px 2px rgba(0,71,251,.22); }
.btn-primary:hover:not(:disabled) { background: #0039C9; box-shadow: 0 2px 8px rgba(0,71,251,.30); opacity: 1; }
.btn-cyan    { background: var(--cyan);   box-shadow: 0 1px 2px rgba(0,135,189,.22); }
.btn-cyan:hover:not(:disabled)    { background: #006E9B; box-shadow: 0 2px 8px rgba(0,135,189,.30); opacity: 1; }

.btn-green:hover:not(:disabled)   { background: #047857; opacity: 1; }
.btn-amber   { background: var(--amber);  box-shadow: 0 1px 2px rgba(180,83,9,.22); }
.btn-amber:hover:not(:disabled)   { background: #92400E; box-shadow: none; opacity: 1; }
.btn-red     { background: var(--red); }
.btn-red:hover:not(:disabled)     { background: #B91C1C; opacity: 1; }
.btn-ghost   { background: #ffffff; }
.btn-ghost:hover:not(:disabled)   { background: #f8fafc; border-color: var(--indigo); }
.btn-refresh { background: #ffffff; }
.btn-refresh:hover:not(:disabled) { background: #f8fafc; box-shadow: var(--glow-indigo); }
.btn-queued  { background:rgba(5,150,105,.10); border-color:rgba(5,150,105,.35) }
.btn-pinged  { background:rgba(0,135,189,.10); border-color:rgba(0,135,189,.35) }
.hotpatch-btn{ background:rgba(180,83,9,.07); border-color:rgba(180,83,9,.35) }
.hotpatch-btn:hover{ background:var(--amber); color:#fff; box-shadow:none }

/* -- Alert chips -------------------------------------------------------- */
.alert-chip.alert-warn{background:rgba(180,83,9,.08); border-color:rgba(180,83,9,.28)}
.alert-chip.alert-crit{background:rgba(220,38,38,.08);border-color:rgba(220,38,38,.28)}

/* -- Inputs ------------------------------------------------------------- */
input[type="text"],input[type="email"],input[type="url"],input[type="date"],textarea,select{

input[type="text"]:focus,input[type="email"]:focus,input[type="url"]:focus,
