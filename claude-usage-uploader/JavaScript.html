<script>
let dashboardData = {};
function esc(s) {
  if (s === null || s === undefined) return '';
  var d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}
let expandState = {};
let pendingExpand = [];
let completedRefresh = {};
let lockedOrder = null;
let countdownInterval;
let refreshTimer;
let refreshCountdown = 30;
let progressInterval = null;
let currentPage = 'overview';
// Global queue status tracking
let gqsIntervalId = null;
let gqsBatchTotal = 0; // set by runAll/runOnline when a batch is kicked off
let gqsBatchSucceeded = 0;
let gqsBatchFailed = 0;
let gqsBatchStartedAt = null;

const pageTitles = {
  overview: 'Overview',
  compliance: 'Compliance',
  developers: 'Registered Users',
  versions: 'Version Matrix',
  queue: 'Queue & Runs',
  health: 'System Health'
};

function navigateTo(page) {
  currentPage = page;
  document.querySelectorAll('.page-view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  var target = document.getElementById('page-' + page);
  if (target) target.classList.add('active');
  var navBtn = document.querySelector('.nav-item[data-page="' + page + '"]');
  if (navBtn) navBtn.classList.add('active');
  document.getElementById('pageTitle').textContent = pageTitles[page] || page;
  if (dashboardData && dashboardData.activeUsers) renderPageData(page);
}

function renderPageData(page) {
  if (page === 'overview')    renderOverviewKpis();
  if (page === 'compliance')  renderCompliancePage();
  if (page === 'developers') {
    renderDevRoster();
    // v5: version-drift preview for the mass reminder card. Fetched on demand
    // rather than bundled into the dashboard payload — it is only ever read on
    // this page, and keeping it out keeps the cached payload small.
    loadReminderPreview();
    loadDownloadUrls();
  }
  if (page === 'versions')    renderVersionMatrix();
  if (page === 'health')      renderHealthKpis();
  if (page === 'queue') {
    renderQueuePage();
    if (!queuePageInterval) {
      queuePageInterval = setInterval(function() {
        if (currentPage === 'queue') renderQueuePage();
        else { clearInterval(queuePageInterval); queuePageInterval = null; }
      }, 3000);
    }
  } else {
    clearInterval(queuePageInterval); queuePageInterval = null;
  }
}

function isPaused() {
  if (document.hidden) return true;
  if (document.getElementById('logsModal') && document.getElementById('logsModal').classList.contains('open')) return true;
  if (document.getElementById('confirmOverlay') && document.getElementById('confirmOverlay').classList.contains('open')) return true;
  return false;
}

function showToast(msg, isErr=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `show ${isErr?'err':'ok'}`;
  setTimeout(()=>t.className='', 3000);
}

function timeSince(date) {
  if (!date) return 'Never';
  const s = Math.floor((new Date() - new Date(date))/1000);
  if (s < 60) return `${s}s ago`;
  const m = Math.floor(s/60); if (m < 60) return `${m}m ago`;
  const h = Math.floor(m/60); if (h < 24) return `${h}h ago`;
  return `${Math.floor(h/24)}d ago`;
}

function getBadgeHtml(status) {
  const s = String(status).toUpperCase().trim();
  if (['SUCCESS', 'REPORTED', 'COMPLIANT'].includes(s)) return '<span class="badge b-green">Reported</span>';
  if (['FAILURE', 'ERROR'].includes(s)) return '<span class="badge b-red">Failed</span>';
  if (s === 'PENDING') return '<span class="badge b-amber">Pending</span>';
  return `<span class="badge b-grey">${esc(status)}</span>`;
}

// Single source of truth for "is this user online right now?"
// Used by the KPI counter, Live Presence table, and runOnline() \u2014 all three must agree.
//
// v2 fix: previously included `lastSeen`, which the server updates on ANY
// status (including SUCCESS/FAILURE). That meant a developer whose service
// crashed right after a successful upload could still read as "online".
// Now only the keep-alive signals (HEARTBEAT/PONG) count.
function isOnline(u) {
  if (!u) return false;
  const lb = u.lastHeartbeat ? new Date(u.lastHeartbeat).getTime() : 0;
  const lp = u.lastPong      ? new Date(u.lastPong).getTime()      : 0;
  const recent = Math.max(lb, lp);
  return recent > 0 && (Date.now() - recent) / 60000 < 10;
}

function formatAbsoluteDateTime(iso) {
  if (!iso) return '\u2014';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '\u2014';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
    + ', ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function getStatusDotHtml(user) {
  if (user.paused) return '<span class="status-dot dot-offline" style="background:var(--amber)" title="User is paused"></span> Paused';
  if (user.pendingTrigger) return '<span class="status-dot dot-waiting" title="Trigger queued"></span> Queued';
  if (!user.lastSeen && !user.lastHeartbeat && !user.lastPong)
    return '<span class="status-dot dot-stalled" title="STALLED \u2014 never seen"></span> <b style="color:var(--red)">Stalled</b>';
  if (isOnline(user)) return '<span class="status-dot dot-online" title="Online (<10m ago)"></span> Online';
  const minAgo = user.lastSeen ? (Date.now() - new Date(user.lastSeen).getTime()) / 60000 : Infinity;
  if (minAgo < 60)   return '<span class="status-dot dot-away"    title="Away (10\u201360m ago)"></span> Away';
  if (minAgo < 1440) return '<span class="status-dot dot-offline" title="Offline (1h\u201324h ago)"></span> Offline';
  return '<span class="status-dot dot-stalled" title="STALLED \u2014 no heartbeat for >24h"></span> <b style="color:var(--red)">Stalled</b>';
}

// v3: isSilent=true refreshes data in the background — no button spinner, no
// full-screen loader, and the DOM is patched in-place so expanded progress
// v5: single choke point for payload shaping.
//
// `activeUsers` is the raw roster and therefore includes soft-removed users
// (they keep their row for the retention window). Every existing consumer —
// the Overview presence table, the online/offline KPIs, the Version Matrix,
// runOnline(), the force-run dropdown — treats that array as "the live fleet",
// so removed users are stripped here rather than at each call site. The full
// list stays reachable as `allUsers` for anything that genuinely needs it.
function normalizePayload(res) {
  if (!res || !res.activeUsers) return res || {};
  var all = res.activeUsers;
  res.allUsers = all;
  res.activeUsers = all.filter(function(u) { return u.status !== 'Removed'; });
  return res;
}

// rows, scroll positions and filters survive. Manual refreshes stay "loud".
function fetchData(isSilent) {
  var rb = document.getElementById('refreshBtn');
  if (!isSilent) {
    rb.disabled = true; rb.classList.add('loading'); rb.innerHTML = '&#8635; Loading...';
  }
  google.script.run.withSuccessHandler(function(res) {
    try {
      dashboardData = normalizePayload(res);
      if (isSilent && document.getElementById('appShell').style.display !== 'none') {
        updateDashboardInPlace();
      } else {
        renderDashboard();
      }
      document.getElementById('loading').style.display = 'none';
      document.getElementById('appShell').style.display = 'flex';

      var now = new Date();
      var ts = now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
      document.getElementById('lastUpdated').textContent = 'Updated ' + ts;

      if (!isSilent) { rb.disabled = false; rb.classList.remove('loading'); rb.innerHTML = '&#8635; Refresh'; }
      resetAutoRefresh();
    } catch(e) {
      showToast('Render error: ' + e.message, true);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('appShell').style.display = 'flex';
      rb.disabled = false; rb.classList.remove('loading'); rb.innerHTML = '&#8635; Refresh';
    }
  }).withFailureHandler(function(err) {
    if (isSilent) {
      // Background refresh failed — try again on the next cycle, no UI noise
      resetAutoRefresh();
      return;
    }
    showToast('Failed to load data: ' + err.message, true);
    document.getElementById('loading').style.display = 'none';
    rb.disabled = false; rb.classList.remove('loading'); rb.innerHTML = '&#8635; Refresh';
  }).getDashboardData();
}

// v3: silent DOM update. Patches the two stateful tables (Active Users on
// Overview, Registered Users roster) row-by-row via data-user keys, then
// re-renders the stateless widgets (KPIs, charts, summary tables). Falls back
// to a full renderDashboard() if the developer set itself changed.
function updateDashboardInPlace() {
  var activeUsers = dashboardData.activeUsers || [];

  // --- Active Users table (Overview) ---
  var tb = document.getElementById('activeUsersTbody');
  var domRows = {};
  var domCount = 0;
  if (tb) {
    tb.querySelectorAll('tr[data-user]').forEach(function(tr) {
      domRows[tr.getAttribute('data-user')] = tr;
      domCount++;
    });
  }
  var sameSet = domCount === activeUsers.length &&
    activeUsers.every(function(u) { return domRows[u.name]; });
  if (!sameSet) { renderDashboard(); return; }

  activeUsers.forEach(function(u) {
    domRows[u.name].innerHTML = activeUserRowHtml(u);
  });

  // --- Registered Users roster: rebuild (no expandable state to preserve) ---
  renderDevRoster();

  // --- Stateless widgets ---
  renderOverviewKpis();
  try { renderHeadlineInsight(); } catch (e) {}
  try { renderOnboardingStrip(); } catch (e) {}
  renderUploadSummaryAndQueue();
  renderCompliancePage();
  renderHealthKpis();
  renderVersionMatrix();

  // Refresh any expanded progress rows with the new data
  var expanded = Object.keys(expandState).filter(function(n) { return expandState[n]; });
  if (expanded.length > 0) fetchProgressBatch(expanded);
  // Keep CSV reconciliation results in sync with the fresh roster
  try { if (parsedCsvNames.length > 0) runRosterReconciliation(); } catch (e) {}
}

// v3: single source for the Active Users row markup — used by both the full
// render and the silent in-place patcher so the two can never drift.
function activeUserRowHtml(u) {
  return `
        <td style="font-weight:600">${esc(u.name)}${u.version ? `<div style="font-size:10px;font-weight:400;color:var(--t3);margin-top:2px">v${esc(u.version)}</div>` : ''}</td>
        <td><div class="status-cell">${getStatusDotHtml(u)}</div></td>
        <td><div style="font-size:11px">${timeSince(u.lastSeen)}</div></td>
        <td><div style="font-size:11px">${timeSince(u.lastPong)}</div></td>
        <td><div style="font-size:11px">${timeSince(u.lastUpload)}</div></td>
        <td>
          <div class="action-cell">
            <button class="btn btn-primary btn-sm ${u.pendingTrigger?'btn-queued':''} js-force-run" data-name="${esc(u.name)}" ${u.pendingTrigger?'disabled':''}>
              ${u.pendingTrigger ? '&#9203; Queued' : '&#9654; Generate'}
            </button>
            <button class="btn btn-cyan btn-sm ${u.pendingPing?'btn-pinged':''} js-ping" data-name="${esc(u.name)}" ${u.pendingPing?'disabled':''}>
              &#128225; Ping
            </button>
            <button class="btn ${u.paused ? 'btn-green' : 'btn-amber'} btn-sm js-toggle-pause" data-name="${esc(u.name)}" data-paused="${u.paused}">
              ${u.paused ? '&#9654; Resume' : '&#9208; Pause'}
            </button>
            <button class="btn btn-ghost btn-sm js-show-logs" data-name="${esc(u.name)}">Logs</button>
          </div>
        </td>
      `;
}

function renderDashboard() {
  Object.values(countdownTimers).forEach(t => clearInterval(t));
  countdownTimers = {};

  const { activeUsers=[] } = dashboardData;

  // Active Users
  const tb = document.getElementById('activeUsersTbody');
  tb.innerHTML = '';
  if (activeUsers.length === 0) {
    document.getElementById('activeUsersTable').style.display = 'none';
    document.getElementById('activeUsersEmpty').style.display = 'block';
  } else {
    document.getElementById('activeUsersTable').style.display = 'table';
    document.getElementById('activeUsersEmpty').style.display = 'none';
    // Stabilize sort order when any pipeline row is expanded
    const hasExpanded = Object.keys(expandState).some(function(k) { return expandState[k]; });
    let orderedUsers = activeUsers;
    if (hasExpanded) {
      if (!lockedOrder) lockedOrder = activeUsers.map(function(u) { return u.name; });
      const orderMap = {};
      lockedOrder.forEach(function(name, i) { orderMap[name] = i; });
      orderedUsers = activeUsers.slice().sort(function(a, b) {
        const ai = orderMap[a.name] !== undefined ? orderMap[a.name] : 9999;
        const bi = orderMap[b.name] !== undefined ? orderMap[b.name] : 9999;
        return ai - bi;
      });
    } else {
      lockedOrder = null;
    }

    orderedUsers.forEach(function(u) {
      const isExp = expandState[u.name];
      const tr = document.createElement('tr');
      tr.className = 'clickable-row';
      tr.setAttribute('data-user', u.name);
      tr.innerHTML = activeUserRowHtml(u);
      tr.onclick = () => toggleRow(u.name);
      tb.appendChild(tr);

      const trExt = document.createElement('tr');
      trExt.className = 'prog-row';
      trExt.innerHTML = `<td colspan="6"><div id="prog_${u.name}" class="prog-inner ${isExp?'open':''}"><div class="loader-wrap"><div class="loader-ring"></div></div></div></td>`;
      tb.appendChild(trExt);
    });

    // Batch fetch any expanded progress rows
    const expandedNames = orderedUsers.filter(u => expandState[u.name]).map(u => u.name);
    if (expandedNames.length > 0) fetchProgressBatch(expandedNames);

    // Auto-expand any rows queued by runAll/runOnline
    if (pendingExpand.length > 0) {
      pendingExpand.forEach(function(name) {
        if (!expandState[name] && document.getElementById('prog_' + name)) {
          toggleRow(name);
        }
      });
      pendingExpand = [];
    }
  }

  renderUploadSummaryAndQueue();

  // Compliance page
  renderCompliancePage();

  // New page renderers
  renderOverviewKpis();
  renderDevRoster();
  renderHealthKpis();
  renderVersionMatrix();
}

// v3: Upload Summary + Trigger Queue + admin dropdown — stateless widgets
// shared by the full render and the silent in-place refresh.
function renderUploadSummaryAndQueue() {
  const { registeredDevelopers=[], complianceByWeek={}, activeUsers=[], triggerQueue=[] } = dashboardData;
  const registeredNames = registeredDevelopers.map(r => r.name);
  const adminTriggers = triggerQueue.map(t => ({ devName: t.name, timestamp: t.queuedAt, notBefore: t.notBefore || '', type: t.type }));
  // Queue dropdown: registered developers + any active users not yet in registered list.
  // v5: registeredDevelopers already excludes removed users, but activeUsers does
  // not — filter them out here too, or a removed user would remain force-runnable.
  const registeredNameSet = new Set(registeredNames);
  const adminUsers = [...new Set([
    ...registeredNames,
    ...(activeUsers || [])
      .filter(u => u.status !== 'Removed')
      .map(u => u.name)
      .filter(n => !registeredNameSet.has(n))
  ])];

  // Upload Summary
  const tbSum = document.getElementById('uploadSummaryBody');
  if (tbSum) {
    tbSum.innerHTML = '';
    // Use server-authoritative current week to avoid timezone mismatch
    const currWeek = dashboardData.currentWeek || '';

    const currentWeekData = complianceByWeek[currWeek] || { details: [] };
    const currentWeekDetails = currentWeekData.details || [];

    adminUsers.forEach(uName => {
      const activeU = dashboardData.activeUsers.find(x => x.name === uName);
      const wkDet = currentWeekDetails.find(x => x.name === uName);
      
      let thisWeekStatus = '<span class="badge b-gray">Pending</span>';
      if (wkDet && wkDet.status === 'SUCCESS') thisWeekStatus = '<span class="badge b-green">Success</span>';
      else if (wkDet && wkDet.status === 'FAILURE') thisWeekStatus = '<span class="badge b-red">Failed</span>';

      const lastUp = activeU && activeU.lastUpload ? new Date(activeU.lastUpload).toLocaleString() : 'Never';
      let nextUp = 'Pending this week';
      if (activeU && activeU.lastSuccessNextPoll) {
        nextUp = new Date(activeU.lastSuccessNextPoll).toLocaleString();
      }

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="font-weight:500">${esc(uName)}</td>
        <td>${thisWeekStatus}</td>
        <td><div style="font-size:12px;color:var(--t2)">${lastUp}</div></td>
        <td><div style="font-size:12px;color:var(--t3)">${nextUp}</div></td>
      `;
      tbSum.appendChild(tr);
    });
  }

  // Admin Queue
  const qb = document.querySelector('#triggerQueueTable tbody');
  qb.innerHTML = '';
  if (adminTriggers.length === 0) {
    document.getElementById('triggerQueueTable').style.display = 'none';
    document.getElementById('triggerQueueEmpty').style.display = 'block';
  } else {
    document.getElementById('triggerQueueTable').style.display = 'table';
    document.getElementById('triggerQueueEmpty').style.display = 'none';
    adminTriggers.forEach((t) => {
      var startsIn = '';
      if (t.notBefore) {
        var msLeft = new Date(t.notBefore) - new Date();
        if (msLeft > 0) {
          var minsLeft = Math.ceil(msLeft / 60000);
          startsIn = minsLeft + 'm';
        } else {
          startsIn = 'Now';
        }
      } else {
        startsIn = 'Now';
      }
      // v2: bulk-select checkbox in the first cell
      var checked = window._bulkQueueSelected && window._bulkQueueSelected[t.devName] ? 'checked' : '';
      qb.innerHTML += `<tr>
        <td><input type="checkbox" ${checked} onchange="toggleQueueBulkSelect('${esc(t.devName).replace(/'/g, "\\'")}', this.checked)"></td>
        <td>${esc(t.devName)}</td>
        <td style="font-size:11px">${t.timestamp ? new Date(t.timestamp).toLocaleString() : ''}</td>
        <td><span class="badge ${startsIn === 'Now' ? 'b-green' : 'b-amber'}">${esc(startsIn)}</span></td>
        <td><span class="badge b-indigo">${esc(t.type)}</span></td>
        <td><button class="btn btn-ghost btn-sm js-cancel-trigger" data-name="${esc(t.devName)}">Cancel</button></td>
      </tr>`;
    });
  }
  // v2: prune any selections that no longer exist in the queue
  if (window._bulkQueueSelected) {
    var stillThere = {};
    adminTriggers.forEach(function(t) { if (window._bulkQueueSelected[t.devName]) stillThere[t.devName] = true; });
    window._bulkQueueSelected = stillThere;
    var bar = document.getElementById('queueBulkBar');
    var count = Object.keys(stillThere).length;
    if (bar) bar.style.display = count > 0 ? 'flex' : 'none';
    var lbl = document.getElementById('queueBulkCount');
    if (lbl) lbl.textContent = count + ' selected';
  }

  // Admin Select
  const sel = document.getElementById('adminNameSelect');
  const curSel = sel.value;
  sel.innerHTML = '<option value="">\u2014 select developer \u2014</option>' + adminUsers.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
  if (curSel) sel.value = curSel;
}

// ==================== COMPLIANCE PAGE RENDERERS ====================

function renderCompliancePage() {
  renderComplianceSnapshot();
  renderComplianceHistoryGrid();
  try { renderStreakLeaderboard(); } catch(e) { console.warn('Streak leaderboard error:', e.message); }
  renderRecentUploads();
}

function renderComplianceSnapshot() {
  const { registeredDevelopers=[], complianceByWeek={}, currentWeek='', activeUsers=[] } = dashboardData;
  const stats = complianceByWeek[currentWeek] || { reported:0, failed:0, details:[] };
  const weekDetails = stats.details || [];
  const registeredCount = registeredDevelopers.length;

  const compliantCount = weekDetails.filter(d =>
    ['SUCCESS','REPORTED','COMPLIANT'].includes(d.status)
  ).length;
  const missingCount = registeredCount - compliantCount;
  const rate = registeredCount > 0 ? Math.round((compliantCount / registeredCount) * 100) : 0;

  const sub = document.getElementById('compSnapshotSubtitle');
  if (sub) sub.textContent = currentWeek ? 'Week of ' + currentWeek : 'Weekly compliance snapshot';

  const csReg = document.getElementById('cs-registered');
  const csComp = document.getElementById('cs-compliant');
  const csMiss = document.getElementById('cs-missing');
  const csRate = document.getElementById('cs-rate');
  if (csReg)  csReg.textContent  = registeredCount;
  if (csComp) csComp.textContent = compliantCount;
  if (csMiss) csMiss.textContent = missingCount;
  if (csRate) csRate.textContent = rate + '%';

  const auMap = {};
  activeUsers.forEach(u => { auMap[u.name] = u; });
  const detailMap = {};
  weekDetails.forEach(d => { detailMap[d.name] = d; });

  const tbody = document.getElementById('compSnapshotTbody');
  if (!tbody) return;
  tbody.innerHTML = registeredDevelopers.map(r => {
    const det = detailMap[r.name];
    const au  = auMap[r.name];
    const statusHtml = det ? getBadgeHtml(det.status) : '<span class="badge b-grey">No Data</span>';
    const lastUpload = au && au.lastUpload ? formatAbsoluteDateTime(au.lastUpload) : '\u2014';
    const version    = au && au.version    ? esc(au.version) : '\u2014';
    return `<tr>
      <td style="font-weight:500">${esc(r.name)}</td>
      <td>${statusHtml}</td>
      <td style="font-size:12px;color:var(--t2)">${lastUpload}</td>
      <td style="font-size:12px;color:var(--t3);font-family:'JetBrains Mono',monospace">${version}</td>
    </tr>`;
  }).join('');
}

function renderComplianceHistoryGrid() {
  const { weekHeaders=[], complianceGrid={}, registeredDevelopers=[] } = dashboardData;
  const thead = document.getElementById('compHistoryHead');
  const tbody = document.getElementById('compHistoryTbody');
  if (!thead || !tbody) return;
  if (!weekHeaders.length || !registeredDevelopers.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty-state">No history data yet.</td></tr>';
    return;
  }

  function fmtWeekLabel(iso) {
    try {
      const d = new Date(iso + 'T00:00:00Z');
      return d.toLocaleDateString(undefined, { month:'short', day:'numeric', timeZone:'UTC' });
    } catch(e) { return iso; }
  }

  let headCells = '<th style="position:sticky;left:0;background:var(--bg2);z-index:2;min-width:140px">Developer</th>';
  weekHeaders.forEach(w => {
    headCells += `<th style="text-align:center;min-width:72px">${esc(fmtWeekLabel(w))}</th>`;
  });
  thead.innerHTML = `<tr>${headCells}</tr>`;

  tbody.innerHTML = registeredDevelopers.map(r => {
    const devWeeks = complianceGrid[r.name] || {};
    let cells = `<td style="font-weight:500;position:sticky;left:0;background:var(--bg2);z-index:1">${esc(r.name)}</td>`;
    weekHeaders.forEach(w => {
      const s = devWeeks[w];
      if (s === 'SUCCESS') {
        cells += `<td style="text-align:center" title="${esc(w)}: SUCCESS"><span style="color:var(--green);font-size:18px">&#10003;</span></td>`;
      } else if (s === 'FAILURE') {
        cells += `<td style="text-align:center" title="${esc(w)}: FAILURE"><span style="color:var(--red);font-size:18px">&#10007;</span></td>`;
      } else {
        cells += `<td style="text-align:center" title="${esc(w)}: No data"><span style="color:var(--t4);font-size:18px">&middot;</span></td>`;
      }
    });
    return `<tr>${cells}</tr>`;
  }).join('');
}

function renderRecentUploads() {
  const uploads = dashboardData.recentUploads || [];
  const tbody = document.getElementById('recentUploadsTbody');
  if (!tbody) return;
  if (!uploads.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No uploads recorded yet.</td></tr>';
    return;
  }
  tbody.innerHTML = uploads.map(u => {
    const badgeCls = u.status === 'SUCCESS' ? 'b-green' : 'b-red';
    // Show reason/details for FAILURE rows; green checkmark for SUCCESS
    let reasonHtml = '';
    if (u.status === 'SUCCESS') {
      reasonHtml = '<span style="color:var(--green);font-size:12px">&#10003; Upload complete</span>';
    } else if (u.message) {
      reasonHtml = `<span style="color:var(--red);font-size:11px;font-family:'JetBrains Mono',monospace;word-break:break-word">${esc(u.message)}</span>`;
    } else {
      reasonHtml = '<span style="color:var(--t4);font-size:11px">\u2014</span>';
    }
    return `<tr>
      <td style="font-weight:500">${esc(u.name)}</td>
      <td style="font-size:12px;color:var(--t2)">${formatAbsoluteDateTime(u.timestamp)}</td>
      <td style="font-size:12px;color:var(--t3)">${esc(u.weekStart)}</td>
      <td><span class="badge ${badgeCls}">${esc(u.status)}</span></td>

function renderStreakLeaderboard() {
  const { weekHeaders=[], complianceGrid={}, registeredDevelopers=[] } = dashboardData;
  const tbody = document.getElementById('streakLeaderboardTbody');
  if (!tbody) return;
  
  if (!weekHeaders.length || !registeredDevelopers.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No streak data available.</td></tr>';
    return;
  }
  
  const leaders = registeredDevelopers.map(r => {
    const devWeeks = complianceGrid[r.name] || {};
    let streak = 0;
    for (let i = weekHeaders.length - 1; i >= 0; i--) {
      const w = weekHeaders[i];
      if (devWeeks[w] === 'SUCCESS') {
        streak++;
      } else {
        break;
      }
    }
    return { name: r.name, streak: streak };
  });
  
  leaders.sort((a, b) => b.streak - a.streak);
  
  tbody.innerHTML = leaders.map((l, index) => {
    let medal = '';
    if (index === 0 && l.streak > 0) medal = '\ud83e\udd47 ';
    else if (index === 1 && l.streak > 0) medal = '\ud83e\udd48 ';
    else if (index === 2 && l.streak > 0) medal = '\ud83e\udd49 ';
    
    let streakBadge = '';
    if (l.streak >= 4) {
      streakBadge = `<span class="badge b-green">\ud83d\udd25 ${l.streak} Weeks</span>`;
    } else if (l.streak > 0) {
      streakBadge = `<span class="badge b-indigo">${l.streak} Weeks</span>`;
    } else {
      streakBadge = `<span class="badge b-grey">0 Weeks</span>`;
    }
    
    return `<tr>
      <td style="font-weight:700;color:var(--t3)">#${index + 1}</td>
      <td style="font-weight:600">${medal}${esc(l.name)}</td>
      <td>${streakBadge}</td>
      <td>${l.streak > 0 ? '<span style="color:var(--green)">Active Streak</span>' : '<span style="color:var(--t3)">Pending Upload</span>'}</td>
    </tr>`;
  }).join('');
}

// ==================== GLOBAL QUEUE STATUS BAR ====================
// Polls getGlobalQueueStatus() every 8 seconds when a batch is active.
// A batch is considered active when the queue bar is visible.
function startGlobalQueuePolling(batchTotal) {
  if (batchTotal && batchTotal > 0) {
    gqsBatchTotal    = batchTotal;
    gqsBatchSucceeded = 0;
    gqsBatchFailed    = 0;
    gqsBatchStartedAt = new Date();
  }
  const bar = document.getElementById('globalQueueBar');
  if (bar) bar.style.display = 'block';
  if (gqsIntervalId) clearInterval(gqsIntervalId);
  refreshGlobalQueueStatus(); // immediate first fetch
  gqsIntervalId = setInterval(refreshGlobalQueueStatus, 8000);
}

function stopGlobalQueuePolling() {
  if (gqsIntervalId) { clearInterval(gqsIntervalId); gqsIntervalId = null; }
  const bar = document.getElementById('globalQueueBar');
  // Keep bar visible for 10s after completion so user can read the final result
  if (bar) setTimeout(() => { if (gqsIntervalId === null) bar.style.display = 'none'; }, 10000);
}

function refreshGlobalQueueStatus() {
  if (isPaused()) return;
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res) return;
      renderGlobalQueueStatus(res);
    })
    .withFailureHandler(function() { /* silent */ })
    .getGlobalQueueStatus();
}

function renderGlobalQueueStatus(res) {
  const bar = document.getElementById('globalQueueBar');
  if (!bar) return;

  const pending     = res.totalQueued     || 0;
  const running     = res.inProgressCount || 0;
  const completed   = res.recentCompleted || [];

  // Update counts from server data
  const succeeded = completed.filter(r => r.status === 'SUCCESS').length;
  const failed    = completed.filter(r => r.status === 'FAILURE').length;
  const doneCount = succeeded + failed;

  // Persist session highs (gqsBatchTotal may grow as smart-retries add more)
  if (gqsBatchTotal < pending + running + doneCount) {
    gqsBatchTotal = pending + running + doneCount;
  }
  gqsBatchSucceeded = succeeded;
  gqsBatchFailed    = failed;

  const total = gqsBatchTotal || (pending + running + doneCount) || 1;
  const progressPct = Math.min(100, Math.round((doneCount / total) * 100));

  // Show/hide bar
  const isActive = pending > 0 || running > 0;
  if (!isActive && doneCount === 0) {
    stopGlobalQueuePolling();
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'block';

  // Update elements
  document.getElementById('gqsPending').textContent  = pending;
  document.getElementById('gqsRunning').textContent  = running;
  document.getElementById('gqsDone').textContent     = succeeded;
  document.getElementById('gqsFailed').textContent   = failed;
  document.getElementById('gqsBar').style.width      = progressPct + '%';

  const title = isActive
    ? `Batch Run \u2014 ${doneCount} of ${total} complete`
    : `Batch Complete \u2014 ${succeeded} succeeded, ${failed} failed`;
  document.getElementById('gqsTitle').textContent = title;

  // Details line: in-progress names
  const inProgressNames = (res.inProgress || []).map(r => r.name);
  const pendingNames    = (res.pending    || []).map(r => r.name);
  let detailParts = [];
  if (inProgressNames.length > 0) detailParts.push('\u25b6 Running: ' + inProgressNames.join(', '));
  if (pendingNames.length > 0)    detailParts.push('\u23f3 Queued: ' + pendingNames.slice(0,5).join(', ') + (pendingNames.length > 5 ? ' +' + (pendingNames.length-5) + ' more' : ''));
  if (failed > 0) {
    const failedNames = completed.filter(r => r.status === 'FAILURE').map(r => r.name);
    detailParts.push('\u274c Failed: ' + failedNames.join(', '));
  }
  document.getElementById('gqsSubtitle').textContent = progressPct + '% complete';
  document.getElementById('gqsDetails').textContent  = detailParts.join('  \u2502  ');

  if (!isActive) stopGlobalQueuePolling();
}

let countdownTimers = {};

function startCountdown(name, nextPollAtStr) {
  if (countdownTimers[name]) clearInterval(countdownTimers[name]);
  const el = document.getElementById(`cd_${name}`);
  if (!el || !nextPollAtStr) return;
  
  const target = new Date(nextPollAtStr).getTime();
  
  countdownTimers[name] = setInterval(() => {
    const now = new Date().getTime();
    const diff = Math.max(0, target - now);
    const sec = (diff / 1000).toFixed(1);
    
    if (diff <= 0) {
      el.textContent = 'Polling now...';
    } else {
      el.textContent = `Next poll in ${sec}s`;
    }
  }, 100);
}

function fetchProgressBatch(names) {
  google.script.run
    .withSuccessHandler(resMap => {
      names.forEach(name => {
        if (expandState[name] && resMap[name]) {
          renderProgressHtml(name, resMap[name]);
        }
      });
    })
    .withFailureHandler(err => showToast('Progress error: ' + err.message, true))
    .getDeveloperProgressStatusBatch(names);
}

function fetchProgress(name) {
  if (!expandState[name]) return;
  fetchProgressBatch([name]);
}

function renderProgressHtml(name, res) {
  const { hasTrigger, recentLogs, lastNextPollAt } = res;
  const logs = recentLogs || [];

  // --- Dynamic Update Pipeline Visualizer ---
  let isUpdatePipeline = false;
  for (let i = 0; i < logs.length; i++) {
    const s = String(logs[i].status).trim().toUpperCase();
    if (s === 'UPDATE_START' || s === 'UPDATED') {
      isUpdatePipeline = true;
      break;
    }
  }

  if (isUpdatePipeline) {
    let updateState = { ack: false, download: false, done: false, err: false };
    for (let i = 0; i < logs.length; i++) {
      const s = String(logs[i].status).trim().toUpperCase();
      if (s === 'UPDATED') {
        if (i === 0 && !hasTrigger) {
          updateState.ack = true; updateState.download = true; updateState.done = true;
        }
        break;
      }
      if (s === 'ERROR' || s === 'FAILURE') {
        if (i === 0 && !hasTrigger) {
          updateState.err = true;
          updateState.ack = true; updateState.download = true; updateState.done = true;
        }
        break;
      }
      if (s === 'UPDATE_START') {
        updateState.ack = true; updateState.download = true;
      }
    }

    const isUpdateDone = updateState.done && !hasTrigger;
    if (isUpdateDone && !completedRefresh[name]) {
      completedRefresh[name] = true;
      setTimeout(fetchData, 1500);
    }

    let html = `
      <div class="prog-steps">
        <div class="prog-step">
          <div class="prog-icon ${hasTrigger && !updateState.ack ? 'spinning' : updateState.ack ? 'active' : ''}">&#8987;</div>
        </div>
        <div class="prog-connector"><div class="prog-fill ${updateState.download ? 'done' : ''}"></div></div>
        
        <div class="prog-step">
          <div class="prog-icon ${updateState.download && !updateState.done ? 'spinning' : updateState.done ? 'active' : ''}">&#128187;</div>
        </div>
        <div class="prog-connector"><div class="prog-fill ${isUpdateDone ? 'done' : ''}"></div></div>
        
        <div class="prog-step">
          <div class="prog-icon ${updateState.err ? 'error' : isUpdateDone ? 'done' : ''}">${updateState.err ? '&#10006;' : '&#10003;'}</div>
        </div>
      </div>
      
      <div class="prog-labels">
        <div class="prog-lbl ${hasTrigger ? 'active' : updateState.ack ? 'done' : ''}">POLLING</div>
        <div class="prog-lbl ${updateState.download && !updateState.done ? 'active' : updateState.done ? 'done' : ''}">DOWNLOADING</div>
        <div class="prog-lbl ${updateState.err ? 'error' : isUpdateDone ? 'done' : ''}">${updateState.err ? 'ERROR' : 'COMPLETE'}</div>
      </div>
    `;

    let subMsg = '';
    if (updateState.err) subMsg = `<div class="prog-msg" style="color:var(--red)">Hot-patch failed. Check client logs.</div>`;
    else if (isUpdateDone) subMsg = `<div class="prog-msg" style="color:var(--green)">Client successfully hot-patched and restarted!</div>`;
    else if (updateState.download) subMsg = `<div class="prog-msg" style="color:var(--t2)">Downloading new binary and hot-swapping locally...</div>`;
    else subMsg = `<div class="prog-msg" style="color:var(--t3)">Waiting for client to pick up update trigger...</div>`;

    let logHtml = `<div class="prog-logs">` + logs.slice(0, 5).map(l => {
      var d = l.timestamp ? new Date(l.timestamp).toLocaleTimeString() : '';
      return `<div class="log-line"><span class="log-ts">[${d}]</span> <span class="badge b-indigo">${esc(l.status)}</span> ${esc(l.message || '')}</div>`;
    }).join('') + `</div>`;

    // Handle both inline rows and expanded queue page containers
    var saved = document.getElementById('prog_' + name);
    var alias = document.getElementById('qprog_' + name);
    if (saved) saved.innerHTML = html + subMsg + logHtml;
    if (alias) alias.innerHTML = html + subMsg + logHtml;
    return;
  }

  // --- Standard Generate & Upload Pipeline ---
  // v2 fix: previously the terminal check was `if (i === 0 && !hasTrigger)`,
  // so if the newest entry happened to be a POLLING_ACK or HEARTBEAT, a
  // FAILURE/SUCCESS at i=1 was silently ignored and the visualizer never
  // resolved. Now we find the most recent terminal event and resolve to it
  // unless an in-progress event is newer than it.
  let state = { ack: false, gen: false, genDone: false, up: false, upDone: false, err: false };
  const TERMINAL = { SUCCESS: 1, FAILURE: 1, ERROR: 1 };
  const PROGRESS = { POLLING_ACK: 1, GENERATE_START: 1, GENERATE_DONE: 1, UPLOAD_START: 1, UPLOAD_DONE: 1 };

  // logs are newest-first; find the index of the newest terminal event
  let termIdx = -1;
  let termStatus = '';
  for (let i = 0; i < logs.length; i++) {
    const s = String(logs[i].status).trim().toUpperCase();
    if (TERMINAL[s]) { termIdx = i; termStatus = s; break; }
  }

  // Determine if any progress event is *newer* than the terminal. If so we're
  // mid-pipeline again (a new run started after the previous terminal).
  let progressNewerThanTerminal = false;
  if (termIdx > 0) {
    for (let i = 0; i < termIdx; i++) {
      const s = String(logs[i].status).trim().toUpperCase();
      if (PROGRESS[s]) { progressNewerThanTerminal = true; break; }
    }
  }

  if (termIdx !== -1 && !hasTrigger && !progressNewerThanTerminal) {
    // Resolved terminal state
    if (termStatus !== 'SUCCESS') state.err = true;
    state.ack = true; state.gen = true; state.genDone = true; state.up = true; state.upDone = true;
  } else {
    // Walk progress events (only those newer than any terminal) to set the bars
    const stopAt = termIdx === -1 ? logs.length : termIdx;
    for (let i = 0; i < stopAt; i++) {
      const s = String(logs[i].status).trim().toUpperCase();
      if (s === 'POLLING_ACK')     state.ack = true;
      if (s === 'GENERATE_START')  { state.ack = true; state.gen = true; }
      if (s === 'GENERATE_DONE')   { state.ack = true; state.gen = true; state.genDone = true; }
      if (s === 'UPLOAD_START')    { state.ack = true; state.gen = true; state.genDone = true; state.up = true; }
      if (s === 'UPLOAD_DONE')     { state.ack = true; state.gen = true; state.genDone = true; state.up = true; }
    }
  }
  
  const isDone = state.upDone && !hasTrigger;
  if (isDone && !completedRefresh[name]) {
    completedRefresh[name] = true;
    setTimeout(fetchData, 1500);
  }

  let html = `
    <div class="prog-steps">
      <!-- 1. Polling -->
      <div class="prog-step">
        <div class="prog-icon ${hasTrigger && !state.ack ? 'spinning' : state.ack ? 'active' : ''}">&#8987;</div>
      </div>
      <div class="prog-connector"><div class="prog-fill ${state.gen ? 'done' : ''}"></div></div>
      
      <!-- 2. Generating -->
      <div class="prog-step">
        <div class="prog-icon ${state.gen && !state.genDone ? 'spinning' : state.genDone ? 'active' : ''}">&#9881;</div>
      </div>
      <div class="prog-connector"><div class="prog-fill ${state.up ? 'done' : ''}"></div></div>
      
      <!-- 3. Uploading -->
      <div class="prog-step">
        <div class="prog-icon ${state.up && !state.upDone ? 'spinning' : state.upDone ? 'active' : ''}">&#9729;</div>
      </div>
      <div class="prog-connector"><div class="prog-fill ${isDone ? 'done' : ''}"></div></div>
      
      <!-- 4. Complete -->
      <div class="prog-step">
        <div class="prog-icon ${state.err ? 'error' : isDone ? 'done' : ''}">${state.err ? '&#10006;' : '&#10003;'}</div>
      </div>
    </div>
    
    <div class="prog-labels">
      <div class="prog-lbl ${hasTrigger ? 'active' : state.ack ? 'done' : ''}">POLLING</div>
      <div class="prog-lbl ${state.gen && !state.genDone ? 'active' : state.genDone ? 'done' : ''}">GENERATING</div>
      <div class="prog-lbl ${state.up && !state.upDone ? 'active' : state.upDone ? 'done' : ''}">UPLOADING</div>
      <div class="prog-lbl ${state.err ? 'error' : isDone ? 'done' : ''}">${state.err ? 'ERROR' : 'COMPLETE'}</div>
    </div>
  `;
  
  let subMsg = '';
  if (state.err) subMsg = `<div class="prog-msg" style="color:var(--red)">Pipeline failed. Check logs for details.</div>`;
  else if (isDone) subMsg = `<div class="prog-msg" style="color:var(--green)">Upload successful.</div>`;
  else if (hasTrigger && !state.ack) subMsg = `<div class="prog-msg">Waiting for client to pick up trigger...</div>`;
  else if (state.ack && !state.genDone) subMsg = `<div class="prog-msg">Client acknowledged, generating report...</div>`;
  
  let cdHtml = '';
  if (!isDone && lastNextPollAt) {
    cdHtml = `<div class="prog-countdown" id="cd_${name}">Next poll sync...</div>`;
  }

  // Recent activity log
  let logsHtml = '';
  if (recentLogs && recentLogs.length > 0) {
    const rows = recentLogs.slice(0, 12).map(function(l) {
      const sc = String(l.status).toLowerCase().replace(/[^a-z0-9]/g, '-');
      return `<tr>
        <td style="font-size:10px;color:var(--t3);white-space:nowrap">${timeSince(l.timestamp)}</td>
        <td><span class="badge b-${sc}" style="font-size:10px">${esc(l.status)}</span></td>
        <td style="font-size:10px;color:var(--t2)">${esc(l.message || '')}</td>
      </tr>`;
    }).join('');
    logsHtml = `<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px">
      <div style="font-size:10px;font-weight:600;color:var(--t3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">Activity Log</div>
      <table style="width:100%;border-collapse:collapse"><tbody>${rows}</tbody></table>
    </div>`;
  }

  document.getElementById('prog_' + name).innerHTML = html + subMsg + cdHtml + logsHtml;
  if (cdHtml) startCountdown(name, lastNextPollAt);
}

function submitAddUser() {
  const nameEl   = document.getElementById('newRegDevName');
  const emailEl  = document.getElementById('newRegDevEmail');
  const sysEl    = document.getElementById('newRegDevSystem');
  const sendEl   = document.getElementById('newRegDevSendEmail');
  const subjEl   = document.getElementById('newRegDevSubject');
  const bodyEl   = document.getElementById('newRegDevBody');
  const btn      = document.getElementById('addUserBtn');
  const msg      = document.getElementById('addUserMsg');

  const name = (nameEl.value || '').trim();
  if (!name) { showToast('Name is required', true); nameEl.focus(); return; }

  const email = (emailEl.value || '').trim();
  const sendEmail = !!(sendEl && sendEl.checked);
  if (sendEmail && !email) {
    showToast('An email address is required to send the setup email', true);
    emailEl.focus();
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Adding…';
  if (msg) msg.textContent = '';

  google.script.run
    .withSuccessHandler(function(res) {
      btn.disabled = false;
      btn.textContent = '+ Add User';
      if (!res.success) {
        showToast('Error: ' + res.error, true);
        if (msg) {
          msg.innerHTML = res.canRestore
            ? '<span style="color:var(--amber)">' + esc(res.error) + '</span>'
            : '';
        }
        return;
      }
      nameEl.value = '';
      emailEl.value = '';
      if (subjEl) subjEl.value = '';
      if (bodyEl) bodyEl.value = '';
      if (sendEl) { sendEl.checked = false; toggleAddUserEmailFields(); }

      if (sendEmail && res.emailSent) {
        showToast('User added and setup email sent');
      } else if (sendEmail && !res.emailSent) {
        // Registration succeeded but the mail did not — say so explicitly
        // rather than reporting a blanket success.
        showToast('User added, but the email failed: ' + (res.emailError || 'unknown'), true);
        if (msg) msg.innerHTML = '<span style="color:var(--red)">Email failed: ' + esc(res.emailError || 'unknown') + '</span>';
      } else {
        showToast('User added');
      }
      fetchData();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      btn.textContent = '+ Add User';
      showToast('Failed: ' + err.message, true);
    })
    .adminAddUser({
      name:         name,
      email:        email,
      system:       sysEl ? sysEl.value : '',
      sendEmail:    sendEmail,
      emailSubject: (sendEmail && subjEl) ? (subjEl.value || '').trim() : '',
      emailBody:    (sendEmail && bodyEl) ? (bodyEl.value || '').trim() : ''
    });
}

function renderLogs() {
  const mb = document.getElementById('logsModalBody');
  if (currentLogs.length === 0) {
    mb.innerHTML = '<div class="empty-state">No logs found</div>';
    return;
  }
  
  const filters = `
    <div class="timeline-filters">
      <button class="tl-filter ${currentLogFilter==='all'?'active':''}" onclick="setLogFilter('all')">All</button>
      <button class="tl-filter ${currentLogFilter==='success'?'active':''}" onclick="setLogFilter('success')">Success/Error</button>
      <button class="tl-filter ${currentLogFilter==='progress'?'active':''}" onclick="setLogFilter('progress')">Pipeline</button>
      <button class="tl-filter ${currentLogFilter==='heartbeat'?'active':''}" onclick="setLogFilter('heartbeat')">Heartbeats</button>
    </div>
  `;
  
  const filtered = currentLogs.filter(row => {
    const s = String(row.status).trim().toUpperCase();
    if (currentLogFilter === 'success') return s==='SUCCESS'||s==='ERROR'||s==='FAILURE';
    if (currentLogFilter === 'progress') return s.includes('START')||s.includes('DONE')||s==='POLLING_ACK';
    if (currentLogFilter === 'heartbeat') return s==='HEARTBEAT'||s==='WAITING'||s==='PONG';
    return true;
  });

  const tlHtml = filtered.map(row => {
    const d = new Date(row.timestamp);
    const dStr = `${d.toLocaleDateString()} ${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;
    const s = String(row.status).trim();
    const sc = s.toLowerCase().replace(/[^a-z0-9]/g, '-');
    const msg = row.message ? `<div class="tl-msg">${esc(row.message)}</div>` : '';
    return `
      <div class="tl-item tl-${sc}">
        <div class="tl-ts" title="${dStr}">${timeSince(d)}</div>
        <div class="tl-body">
          <div style="font-weight:600;font-size:13px;color:var(--t1)">${esc(s)}</div>
          ${msg}
        </div>
      </div>
    `;
  }).join('');
  
  mb.innerHTML = filters + `<div class="timeline">${tlHtml||'<div class="empty-state">No matching logs</div>'}</div>`;
}

function setLogFilter(f) {
  currentLogFilter = f;
  renderLogs();
}

// Auto-refresh — v3: 120s on every page, and the cycle refresh is SILENT
// (in-place DOM patch, no loader flash). Manual button clicks stay loud.
function resetAutoRefresh() {
  refreshCountdown = 120;
  updateBadge();
  clearInterval(countdownInterval);
  clearTimeout(refreshTimer);

  countdownInterval = setInterval(() => {
    if (isPaused()) {
      document.getElementById('countdownBadge').innerHTML = `Auto-refresh paused`;
      return;
    }
    refreshCountdown--;
    updateBadge();
    if (refreshCountdown <= 0) {
      clearInterval(countdownInterval);
      fetchData(true);
    }
  }, 1000);

  if (!progressInterval) {
    progressInterval = setInterval(() => {
      if (isPaused()) return;
      const expanded = Object.keys(expandState).filter(n => expandState[n]);
      if (expanded.length > 0) fetchProgressBatch(expanded);
    }, 4000);  // 4s \u2014 reduced from 1.5s to cut spreadsheet read pressure
  }

  if (!lastModifiedInterval) {
    lastModifiedInterval = setInterval(function() {
      if (isPaused()) return;
      google.script.run
        .withSuccessHandler(function(r) {
          if (!r || !r.ts) return;
          if (lastModifiedTs === 0) {
            lastModifiedTs = r.ts;
          } else if (r.ts > lastModifiedTs) {
            lastModifiedTs = r.ts;
            fetchData(true); // v3: server-change refreshes are silent too
          }
        })
        .getLastModified();
    }, 10000);  // 10s \u2014 reduced from 5s to cut concurrent GAS invocations
  }
}

function updateBadge() {
  document.getElementById('countdownBadge').innerHTML = `Auto-refresh in <strong>${refreshCountdown}s</strong>`;
}

function renderOverviewKpis() {
  const { registeredDevelopers=[], activeUsers=[], triggerQueue=[], complianceByWeek={}, currentWeek='' } = dashboardData;
  const onlineCount = activeUsers.filter(isOnline).length;
  const registeredCount = registeredDevelopers.length;

  const stats = complianceByWeek[currentWeek] || { reported:0, failed:0, details:[] };
  const weekDetails = stats.details || [];
  const rate = registeredCount > 0 ? Math.round((stats.reported / registeredCount) * 100) : 0;

  // Count registered devs who haven't uploaded this week
  const notUploaded = registeredDevelopers.filter(r => {
    const d = weekDetails.find(x => x.name === r.name);
    return !d || !['SUCCESS', 'REPORTED', 'COMPLIANT'].includes(d.status);
  }).length;

  // KPI order: Online Now first (most real-time), then compliance stats
  document.getElementById('overviewKpis').innerHTML = `
    <div class="kpi-card"><div class="kpi-val" style="color:var(--green)">${onlineCount}</div><div class="kpi-label">Online Now</div></div>
    <div class="kpi-card"><div class="kpi-val sv-indigo">${registeredCount}</div><div class="kpi-label">Registered Devs</div></div>
    <div class="kpi-card"><div class="kpi-val sv-green">${stats.reported}</div><div class="kpi-label">Uploaded</div></div>
    <div class="kpi-card"><div class="kpi-val sv-amber">${notUploaded}</div><div class="kpi-label">Pending</div></div>
    <div class="kpi-card"><div class="kpi-val sv-red">${stats.failed}</div><div class="kpi-label">Failed</div></div>
    <div class="kpi-card"><div class="kpi-val sv-cyan">${rate}%</div><div class="kpi-label">Compliance</div></div>
    <div class="kpi-card"><div class="kpi-val" style="color:var(--purple)">${triggerQueue.length}</div><div class="kpi-label">Queued Runs</div></div>
  `;

  // Alert Rail \u2014 meaningful signals only
  var alerts = [];
  if (notUploaded > 0) alerts.push({ cls: 'alert-warn', text: notUploaded + ' registered dev' + (notUploaded === 1 ? '' : 's') + ' haven\'t uploaded this week' });
  if (stats.failed > 0) alerts.push({ cls: 'alert-crit', text: stats.failed + ' upload failure' + (stats.failed === 1 ? '' : 's') + ' detected' });
  if (triggerQueue.length > 0) alerts.push({ cls: 'alert-info', text: triggerQueue.length + ' force run' + (triggerQueue.length === 1 ? '' : 's') + ' queued' });
  if (rate === 100 && registeredCount > 0) alerts.push({ cls: 'alert-ok', text: 'Full compliance achieved this week' });

  document.getElementById('alertRail').innerHTML = alerts.map(a =>
    `<div class="alert-chip ${a.cls}">${a.text}</div>`
  ).join('');

  // Exceptions Table
  renderExceptions();
}

function renderExceptions() {
  const { registeredDevelopers=[], activeUsers=[], complianceByWeek={}, currentWeek='' } = dashboardData;
  const stats = complianceByWeek[currentWeek] || { details: [] };
  const details = stats.details || [];
  var exceptions = [];

  // v3: exceptions are derived from the registered roster (Expected list removed)
  registeredDevelopers.map(r => r.name).forEach(name => {
    const activeU = activeUsers.find(u => u.name === name);
    const wkDet = details.find(d => d.name === name);
    const uploaded = wkDet && wkDet.status === 'SUCCESS';
    const failed = wkDet && (wkDet.status === 'FAILURE' || wkDet.status === 'ERROR');

    var presence = 'Unknown';
    if (activeU) {
      const lb = activeU.lastHeartbeat ? new Date(activeU.lastHeartbeat) : 0;
      const ls = activeU.lastSeen ? new Date(activeU.lastSeen) : 0;
      const recent = new Date(Math.max(lb, ls));
      const minAgo = recent.getTime() ? (new Date() - recent) / 60000 : Infinity;
      if (minAgo < 10)   presence = 'Online';
      else if (minAgo < 60)   presence = 'Away';
      else if (minAgo < 1440) presence = 'Offline';
      else presence = 'Stalled';
    }

    var issue = '', priority = 0;
    if (presence === 'Stalled') { issue = 'Service stalled'; priority = 4; }
    else if (failed)   { issue = 'Upload failed';  priority = 3; }
    else if (presence === 'Unknown') { issue = 'Never seen'; priority = 2; }
    else if (!uploaded){ issue = 'Pending upload'; priority = 1; }

    if (issue) {
      exceptions.push({ name, issue, presence, lastUpload: activeU ? timeSince(activeU.lastUpload) : 'Never', priority });
    }
  });

  exceptions.sort((a, b) => b.priority - a.priority);
  const tbody = document.getElementById('exceptionsTbody');
  const tbl = document.getElementById('exceptionsTable');
  const empty = document.getElementById('exceptionsEmpty');

  if (exceptions.length === 0) {
    tbl.style.display = 'none'; empty.style.display = 'block';
  } else {
    tbl.style.display = 'table'; empty.style.display = 'none';
    tbody.innerHTML = exceptions.map(e => {
      var issueCls = e.priority >= 4 ? 'b-red' : e.priority === 3 ? 'b-red' : e.priority === 2 ? 'b-amber' : 'b-grey';
      var presCls = e.presence === 'Online' ? 'b-green' : e.presence === 'Away' ? 'b-amber' : e.presence === 'Stalled' ? 'b-red' : 'b-grey';
      return `<tr>
        <td style="font-weight:600">${esc(e.name)}</td>
        <td><span class="badge ${issueCls}">${esc(e.issue)}</span></td>
        <td><span class="badge ${presCls}">${esc(e.presence)}</span></td>
        <td style="font-size:12px;color:var(--t3)">${e.lastUpload}</td>
        <td><button class="btn btn-primary btn-sm js-force-run" data-name="${esc(e.name)}">&#9654; Generate</button></td>
      </tr>`;
    }).join('');
  }
}

function renderHealthKpis() {
  const { activeUsers=[], triggerQueue=[] } = dashboardData;
  let online = 0, stalled = 0;
  activeUsers.forEach(u => {
    const lb = u.lastHeartbeat ? new Date(u.lastHeartbeat) : 0;
    const ls = u.lastSeen ? new Date(u.lastSeen) : 0;
    const recent = new Date(Math.max(lb, ls));
    if (!recent.getTime()) { stalled++; return; }
    const minAgo = (new Date() - recent) / 60000;
    if (minAgo < 10) online++;
    else if (minAgo >= 1440) stalled++;
  });

  const stalledCls = stalled > 0 ? 'sv-red' : 'sv-green';
  document.getElementById('healthKpis').innerHTML = `
    <div class="kpi-card"><div class="kpi-val sv-green">${online}</div><div class="kpi-label">Online</div></div>
    <div class="kpi-card"><div class="kpi-val sv-amber">${activeUsers.length - online - stalled}</div><div class="kpi-label">Offline</div></div>
    <div class="kpi-card"><div class="kpi-val ${stalledCls}">${stalled}</div><div class="kpi-label">Stalled</div></div>
    <div class="kpi-card"><div class="kpi-val sv-cyan">${triggerQueue.length}</div><div class="kpi-label">Pending Ops</div></div>
  `;
  // Populate the complete schedule from server data.
  const freqSel = document.getElementById('uploadFreqSelect');
  const schedule = dashboardData.uploadSchedule || { frequency: dashboardData.uploadFrequency || 'weekly', time: '13:00', day: 'Tuesday', monthDay: 1 };
  if (freqSel) freqSel.value = schedule.frequency;
  const daySel = document.getElementById('uploadDaySelect');
  if (daySel) daySel.value = schedule.day || 'Tuesday';
  const monthDay = document.getElementById('uploadMonthDay');
  if (monthDay) monthDay.value = schedule.monthDay || 1;
  const timeInput = document.getElementById('uploadTimeInput');
  if (timeInput) timeInput.value = schedule.time || '13:00';
}

function saveUploadSchedule() {
  const sel = document.getElementById('uploadFreqSelect');
  const daySel = document.getElementById('uploadDaySelect');
  const monthDay = document.getElementById('uploadMonthDay');
  const timeInput = document.getElementById('uploadTimeInput');
  const btn = document.getElementById('saveFreqBtn');
  const res = document.getElementById('saveFreqResult');
  const freq = sel.value;
  const schedule = {
    frequency: freq,
    day: daySel.value,
    monthDay: Number(monthDay.value || 1),
    time: timeInput.value || '13:00'
  };
  btn.disabled = true; btn.textContent = 'Saving...'; res.textContent = '';
  google.script.run
    .withSuccessHandler(function(r) {
      btn.disabled = false; btn.textContent = 'Save schedule';
      if (r.success) {
        res.textContent = '';
        showToast('Upload schedule saved: ' + freq + ' at ' + schedule.time);
        fetchData();
      } else {
        res.textContent = r.error || 'Error';
        showToast('Error: ' + (r.error || 'Unknown'), true);
      }
    })
    .withFailureHandler(function(err) {
      btn.disabled = false; btn.textContent = 'Save schedule';
      showToast('Failed: ' + err.message, true);
    })
    .setUploadSchedule(schedule);
}

function renderDevRoster() {
  const { registeredDevelopers=[], activeUsers=[] } = dashboardData;
  const tbody  = document.getElementById('devRosterTbody');
  const kpiContainer = document.getElementById('developersKpis');
  if (!tbody) return;

  // v5: keep the dependent Users-page widgets in sync with every roster render.
  try { populateSystemOptions(); } catch (e) {}
  try { renderRemovedUsers(); } catch (e) {}

  // Count KPI totals
  let onlineCount  = 0;
  let offlineCount = 0;
  let stalledCount = 0;
  let pausedCount  = 0;

  const rosterRows = registeredDevelopers.map(function(reg) {
    const name    = reg.name || reg;
    const activeU = activeUsers.find(function(u) { return u.name === name; }) || {};

    // v5: lifecycle status. Every user who is neither paused nor removed reads
    // as Active — including users who have never pinged, since "Active" is an
    // administrative state, not a liveness signal (that is the next column).
    const status = activeU.status || reg.status || 'Active';
    if (status === 'Paused') pausedCount++;
    const statusBadge = status === 'Paused'
      ? '<span class="badge b-amber">Paused</span>'
      : '<span class="badge b-green">Active</span>';

    // Email / System — the two fields the setup and reminder mails depend on.
    const email  = activeU.email  || reg.email  || '';
    const system = activeU.system || reg.system || '';
    const emailHtml = email
      ? `<span style="font-size:12px;color:var(--t2)">${esc(email)}</span>`
      : `<span style="font-size:12px;color:var(--amber)" title="No email on file — this user cannot be sent setup or reminder mail">No email</span>`;
    const contactHtml = `${emailHtml}<br><span style="font-size:11px;color:var(--t3)">${system ? esc(system) : 'System not set'}</span>`;

    // Version badge
    const ver = activeU.version || '\u2014';
    const verBadge = ver !== '\u2014'
      ? `<span class="badge b-indigo" style="font-family:monospace">v${esc(ver)}</span>`
      : `<span class="badge b-grey">Unknown</span>`;

    // Status dot & KPI tallying
    let statusHtml;
    if (!activeU.name) {
      statusHtml = '<span class="status-dot dot-stalled"></span> <b style="color:var(--red)">Never seen</b>';
      stalledCount++;
    } else if (isOnline(activeU)) {
      statusHtml = getStatusDotHtml(activeU);
      onlineCount++;
    } else {
      const minAgo = activeU.lastSeen ? (Date.now() - new Date(activeU.lastSeen).getTime()) / 60000 : Infinity;
      statusHtml = getStatusDotHtml(activeU);
      if (minAgo >= 1440) stalledCount++;
      else offlineCount++;
    }

    // Last Active \u2014 relative with absolute tooltip
    const lastSeenRel = activeU.lastSeen ? timeSince(activeU.lastSeen)
                      : (activeU.lastHeartbeat ? timeSince(activeU.lastHeartbeat) : 'Never');
    const lastSeenAbs = activeU.lastSeen ? formatAbsoluteDateTime(activeU.lastSeen)
                      : (activeU.lastHeartbeat ? formatAbsoluteDateTime(activeU.lastHeartbeat) : '');
    const lastSeenHtml = lastSeenAbs
      ? `<span title="${esc(lastSeenAbs)}" style="cursor:default">${esc(lastSeenRel)}</span>
         <br><span style="font-size:11px;color:var(--t3)">${esc(lastSeenAbs)}</span>`
      : 'Never';

    // Last Upload \u2014 relative + absolute
    const lastUploadRel = activeU.lastUpload ? timeSince(activeU.lastUpload) : 'Never';
    const lastUploadAbs = activeU.lastUpload ? formatAbsoluteDateTime(activeU.lastUpload) : '';
    const lastUploadHtml = lastUploadAbs
      ? `<span style="font-size:12px;color:var(--t2);font-weight:600">${esc(lastUploadRel)}</span>
         <br><span style="font-size:11px;color:var(--t3)">${esc(lastUploadAbs)}</span>`
      : '<span style="font-size:12px;color:var(--t3)">Never uploaded</span>';

    // v3: Pause/Resume + Delete management actions live on this roster
    const pauseBtnHtml = activeU.paused
      ? `<button class="btn btn-green btn-sm js-toggle-pause" data-name="${esc(name)}" data-paused="true">&#9654; Resume</button>`
      : `<button class="btn btn-amber btn-sm js-toggle-pause" data-name="${esc(name)}" data-paused="false">&#9208; Pause</button>`;

    return `<tr data-user="${esc(name)}">
      <td style="font-weight:600">${esc(name)}</td>
      <td>${statusBadge}</td>
      <td>${contactHtml}</td>
      <td><div class="status-cell">${statusHtml}</div></td>
      <td>${lastSeenHtml}</td>
      <td>${lastUploadHtml}</td>
      <td>${verBadge}</td>
      <td>
        <div class="action-cell">
          <button class="btn btn-primary btn-sm ${activeU.pendingTrigger ? 'btn-queued' : ''} js-force-run" data-name="${esc(name)}" ${activeU.pendingTrigger ? 'disabled' : ''}>
            ${activeU.pendingTrigger ? '&#9203; Queued' : '&#9654; Generate'}
          </button>
          ${pauseBtnHtml}
          <button class="btn btn-ghost btn-sm js-edit-user" data-name="${esc(name)}"
                  data-email="${esc(email)}" data-system="${esc(system)}">&#9998; Edit</button>
          <button class="btn btn-cyan btn-sm js-email-setup" data-name="${esc(name)}" ${email ? '' : 'disabled title="No email on file"'}>&#9993; Email</button>
          <button class="btn btn-red btn-sm js-remove-reg-dev" data-name="${esc(name)}">&#128465; Delete</button>
          <button class="btn btn-ghost btn-sm js-show-logs" data-name="${esc(name)}">Logs</button>
        </div>
      </td>
    </tr>`;
  });

  // Render KPI strip
  if (kpiContainer) {
    const removedCount = (dashboardData.removedUsers || []).length;
    kpiContainer.innerHTML = `
      <div class="kpi-card"><div class="kpi-val sv-indigo">${registeredDevelopers.length}</div><div class="kpi-label">Active Users</div></div>
      <div class="kpi-card"><div class="kpi-val sv-green">${onlineCount}</div><div class="kpi-label">Online Now</div></div>
      <div class="kpi-card"><div class="kpi-val sv-amber">${offlineCount}</div><div class="kpi-label">Offline</div></div>
      <div class="kpi-card"><div class="kpi-val ${stalledCount > 0 ? 'sv-red' : 'sv-green'}">${stalledCount}</div><div class="kpi-label">Stalled (&gt;24h)</div></div>
      <div class="kpi-card"><div class="kpi-val ${pausedCount > 0 ? 'sv-amber' : 'sv-green'}">${pausedCount}</div><div class="kpi-label">Paused</div></div>
      <div class="kpi-card"><div class="kpi-val sv-indigo">${removedCount}</div><div class="kpi-label">Removed (retained)</div></div>
    `;
  }

  tbody.innerHTML = rosterRows.length
    ? rosterRows.join('')
    : '<tr><td colspan="8" class="empty-state">No active users found.</td></tr>';
}

// v5: removed users still inside their retention window. Hidden entirely when
// there are none, so the page stays clean in the common case.
function renderRemovedUsers() {
  const removed = dashboardData.removedUsers || [];
  const card  = document.getElementById('removedUsersCard');
  const tbody = document.getElementById('removedUsersTbody');
  const sub   = document.getElementById('removedUsersSub');
  if (!card || !tbody) return;

  if (removed.length === 0) { card.style.display = 'none'; return; }
  card.style.display = '';

  const retention = dashboardData.removedRetentionDays || 120;
  if (sub) {
    sub.innerHTML = `Their uploaded reports stay available for <b>${retention} days</b> from the removal date, ` +
                    `then the roster row and the Drive files are purged automatically.`;
  }

  tbody.innerHTML = removed.map(function(u) {
    const daysLeft = (u.retentionDaysLeft === null || u.retentionDaysLeft === undefined) ? null : u.retentionDaysLeft;
    let retHtml;
    if (daysLeft === null) {
      retHtml = '<span class="badge b-grey">Unknown</span>';
    } else if (daysLeft <= 7) {
      retHtml = `<span class="badge b-red">${daysLeft} day${daysLeft === 1 ? '' : 's'} left</span>`;
    } else if (daysLeft <= 30) {
      retHtml = `<span class="badge b-amber">${daysLeft} days left</span>`;
    } else {
      retHtml = `<span class="badge b-green">${daysLeft} days left</span>`;
    }
    const removedOn = u.removedAt
      ? `<span title="${esc(u.removedAt)}">${esc(String(u.removedAt).substring(0, 10))}</span>`
      : '<span style="color:var(--t3)">&#8212;</span>';
    return `<tr data-user="${esc(u.name)}">
      <td style="font-weight:600">${esc(u.name)}</td>
      <td>${removedOn}</td>
      <td>${retHtml}</td>
      <td><span style="font-size:12px;color:var(--t3)">${u.email ? esc(u.email) : '&#8212;'}</span></td>
      <td>
        <div class="action-cell">
          <button class="btn btn-green btn-sm js-restore-user" data-name="${esc(u.name)}">&#8634; Restore</button>
          <button class="btn btn-red btn-sm js-purge-user" data-name="${esc(u.name)}">&#128465; Purge now</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

// v2: live value is dynamically fetched from the Gist at runtime (client-side)
// to bypass server cache/fetch issues and prevent hardcoding.
let LATEST_VERSION_FALLBACK = '2.0.5';
const VERSION_MANIFEST_URL = 'https://gist.githubusercontent.com/tpansuriya-ship-it/efa5db7d25aaa85db78d8bdc402f9903/raw/version.json';
function fetchLatestVersionFromGist() {
  fetch(VERSION_MANIFEST_URL + '?cachebust=' + Date.now(), { cache: 'no-store' })
    .then(r => r.json())
    .then(json => {
      if (json && json.latestVersion) {
        LATEST_VERSION_FALLBACK = json.latestVersion;
        if (dashboardData) {
          dashboardData.latestVersion = json.latestVersion;
        }
        if (typeof renderVersionMatrix === 'function') {
          try { renderVersionMatrix(); } catch(e) {}
        }
      }
    })
    .catch(e => console.warn('Failed to fetch version from gist:', e));
}
fetchLatestVersionFromGist();

function getLatestVersionClient() {
  return (dashboardData && dashboardData.latestVersion) || LATEST_VERSION_FALLBACK;
}

function compareVersions(v1, v2) {
  const parts1 = v1.replace(/^v/, '').split('.').map(Number);
  const parts2 = v2.replace(/^v/, '').split('.').map(Number);
  for (let i = 0; i < Math.max(parts1.length, parts2.length); i++) {
    const p1 = parts1[i] || 0;
    const p2 = parts2[i] || 0;
    if (p1 > p2) return 1;
    if (p1 < p2) return -1;
  }
  return 0;
}

function renderVersionMatrix() {
  const { activeUsers=[] } = dashboardData;
  const grid = document.getElementById('versionMatrixGrid');
  if (!grid) return;

  if (!activeUsers || activeUsers.length === 0) {
    grid.innerHTML = '<div class="empty-state">No active users found.</div>';
    var dk = document.getElementById('versionDriftKpi'); if (dk) dk.innerHTML = '';
    return;
  }

  // v2: drift KPI strip + "Force update all outdated" action
  const latest = getLatestVersionClient();
  const byVer = {};
  let outdatedNames = [];
  activeUsers.forEach(function(u) {
    var v = u.version || 'unknown';
    byVer[v] = (byVer[v] || 0) + 1;
    if (u.version && compareVersions(u.version, latest) < 0) outdatedNames.push(u.name);
  });
  const driftKpi = document.getElementById('versionDriftKpi');
  if (driftKpi) {
    const verChips = Object.keys(byVer).sort().map(function(v) {
      const isLatest = v === latest;
      const color = isLatest ? 'var(--green,#10b981)' : v === 'unknown' ? 'var(--muted,#94a3b8)' : 'var(--amber,#f59e0b)';
      return '<span style="display:inline-flex;align-items:center;gap:0.4rem;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:999px;padding:0.3rem 0.7rem;font-size:0.8rem;margin-right:0.4rem;"><span style="width:8px;height:8px;border-radius:50%;background:' + color + ';"></span><b>v' + esc(v) + '</b> <span style="color:var(--muted);">\u00d7' + byVer[v] + '</span></span>';
    }).join('');
    const action = outdatedNames.length > 0
      ? '<button class="btn btn-primary btn-sm" onclick="forceUpdateAllOutdated()" style="margin-left:auto;">&#9881; Force update ' + outdatedNames.length + ' outdated</button>'
      : '<span style="color:var(--green,#10b981);font-weight:600;">All up to date</span>';
    driftKpi.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0.85rem 1rem;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:10px;margin-bottom:1rem;flex-wrap:wrap;">' +
      '<div><span style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);">Latest manifest</span> <b>v' + esc(latest) + '</b></div>' +
      '<div>' + verChips + '</div>' +
      '<div style="margin-left:auto;">' + action + '</div>' +
      '</div>';
  }
  window._outdatedVersionNames = outdatedNames; // stash for the bulk-update button

  // Sort users alphabetically
  const sorted = activeUsers.slice().sort((a,b) => a.name.localeCompare(b.name));
  
  grid.innerHTML = sorted.map(u => {
    const ver = u.version || '1.9.0';
    const isUpToDate = compareVersions(ver, getLatestVersionClient()) >= 0;
    const badgeClass = isUpToDate ? 'version-badge-green' : 'version-badge-orange';
    const badgeText = isUpToDate ? 'v' + ver + ' (Secure)' : 'v' + ver + ' (Outdated)';
    
    let btnHtml = isUpToDate 
      ? '<button class="btn btn-ghost btn-sm" disabled>Up to date</button>'
      : '<button class="btn btn-primary btn-sm hotpatch-btn" onclick="forceHotPatch(this, \'' + esc(u.name) + '\')">&#9881; Force Hot-Patch</button>';
      
    return `
      <div class="vm-card">
        <div style="font-weight:600; font-size:15px; margin-bottom:8px">${esc(u.name)}</div>
        <div style="margin-bottom:12px">
          ${getStatusDotHtml(u)}
        </div>
        <div class="version-badge ${badgeClass}" style="margin-bottom:12px">
          ${badgeText}
        </div>
        ${btnHtml}
      </div>
    `;
  }).join('');
}

function forceHotPatch(btn, name) {
  // Safe argument shifting for old/new signatures
  if (name === undefined) {
    name = btn;
    btn = null;
    if (typeof event !== 'undefined' && event) {
      btn = event.target || event.srcElement;
      if (btn && btn.tagName !== 'BUTTON') {
        btn = btn.closest('button');
      }
    }
  }

  if (!confirm('Force an immediate hot-patch update for ' + name + '?')) return;
  
  const origText = btn ? btn.innerHTML : '';
  if (btn) {
    btn.innerHTML = '&#8987; Queuing...';
    btn.disabled = true;
  }
  
  google.script.run
    .withSuccessHandler(function(res) {
      showToast('Hot-patch queued for ' + name);
      if (btn) {
        btn.innerHTML = '&#10003; Queued';
      }
      setTimeout(function() { fetchData(); }, 1500);
    })
    .withFailureHandler(function(err) {
      showToast('Failed to queue hot-patch: ' + err.message, true);
      if (btn) {
        btn.innerHTML = origText;
        btn.disabled = false;
      }
    })
    .forceSendUpdateTrigger(name);
}

// v2: short helper used everywhere a non-blocking success/error needs to surface.
function showToastV2(msg, variant) {
  variant = variant || 'info';
  // Reuse the existing toast if available; otherwise build an ephemeral one.
  var legacy = document.getElementById('toast');
  if (legacy && variant !== 'warn') {
    showToast(msg, variant === 'error');
    return;
  }
  var container = document.getElementById('toastContainerV2');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toastContainerV2';
    container.style.cssText = 'position:fixed;top:1rem;right:1rem;z-index:9999;display:flex;flex-direction:column;gap:0.5rem;pointer-events:none;';
    document.body.appendChild(container);
  }
  var colors = {
    info:    { bg: 'rgba(37,99,235,0.18)',  bd: 'rgba(37,99,235,0.4)',  fg: '#60a5fa' },
    success: { bg: 'rgba(16,185,129,0.18)', bd: 'rgba(16,185,129,0.4)', fg: '#34d399' },
    warn:    { bg: 'rgba(245,158,11,0.18)', bd: 'rgba(245,158,11,0.4)', fg: '#fbbf24' },
    error:   { bg: 'rgba(239,68,68,0.18)',  bd: 'rgba(239,68,68,0.4)',  fg: '#f87171' }
  };
  var c = colors[variant] || colors.info;
  var el = document.createElement('div');
  el.style.cssText = 'pointer-events:auto;background:' + c.bg + ';border:1px solid ' + c.bd + ';color:' + c.fg + ';padding:0.7rem 1rem;border-radius:8px;font-size:0.85rem;max-width:380px;box-shadow:0 8px 24px rgba(0,0,0,0.3);backdrop-filter:blur(10px);';
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(function() { el.style.opacity = '0'; el.style.transform = 'translateX(20px)'; el.style.transition = 'all 0.25s'; setTimeout(function() { el.remove(); }, 260); }, 3500);
}

// v2: headline insight card at the top of the Overview page. Summarizes the
// single most-actionable metric ("Compliance 86% \u2014 7 devs missing this week").
function renderHeadlineInsight() {
  var card = document.getElementById('headlineInsight');
  if (!card || !dashboardData) return;
  var users = dashboardData.activeUsers || [];
  var registered = dashboardData.registeredDevelopers || [];
  var currentWeek = dashboardData.currentWeek || '';
  var weekBucket = (dashboardData.complianceByWeek && dashboardData.complianceByWeek[currentWeek]) || { details: [], reported: 0, failed: 0, pending: 0, expected: 0 };
  var total = weekBucket.expected || registered.length;
  var compliant = weekBucket.reported || 0;
  var failed = weekBucket.failed || 0;
  var missing = Math.max(0, total - compliant - failed);
  var pct = total > 0 ? Math.round((compliant / total) * 100) : 0;
  var stalledCount = users.filter(function(u) {
    var lb = u.lastHeartbeat ? new Date(u.lastHeartbeat).getTime() : 0;
    var lp = u.lastPong ? new Date(u.lastPong).getTime() : 0;
    var keepalive = Math.max(lb, lp);
    if (!keepalive) return false;
    return (Date.now() - keepalive) / 3600000 >= 24;
  }).length;
  var onlineCount = users.filter(isOnline).length;
  var headline = '<strong>' + pct + '% compliance</strong> for week of ' + esc(currentWeek) + ' \u2014 ' +
    '<span style="color:var(--green,#10b981);font-weight:600;">' + compliant + ' reported</span>';
  if (failed > 0) headline += ', <span style="color:var(--red,#ef4444);font-weight:600;">' + failed + ' failed</span>';
  if (missing > 0) headline += ', <span style="color:var(--amber,#f59e0b);font-weight:600;">' + missing + ' missing</span>';
  headline += '. <span style="color:var(--muted);">' + onlineCount + '/' + total + ' online now';
  if (stalledCount > 0) headline += ' \u00b7 <span style="color:var(--red,#ef4444);">' + stalledCount + ' stalled &gt;24h</span>';
  headline += '.</span>';
  card.innerHTML = headline;
  card.style.display = 'block';
}
