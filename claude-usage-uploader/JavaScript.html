// ==================== CSV ROSTER RECONCILIATION (v3) ====================
// Admin uploads a CSV/TXT of expected active developers (one name per line,
// or first column of a standard CSV). Names are normalized and compared
// against registeredDevelopers:
//   - in CSV but not registered  -> "Awaiting Onboarding" (+ Register)
//   - registered but not in CSV  -> "Out of Sync / To Pause" (Pause / Delete)
let parsedCsvNames = [];

function initCsvUpload() {
  const zone = document.getElementById('csvUploadZone');
  const input = document.getElementById('csvFileInput');
  if (!zone || !input) return;

  zone.onclick = () => input.click();
  input.onchange = (e) => { handleCsvFile(e.target.files[0]); input.value = ''; };

  zone.ondragover = zone.ondragenter = (e) => { e.preventDefault(); zone.classList.add('dragover'); };
  zone.ondragleave = zone.ondragend = () => { zone.classList.remove('dragover'); };
  zone.ondrop = (e) => {
    e.preventDefault();
    zone.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleCsvFile(e.dataTransfer.files[0]);
  };
}

function handleCsvFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) { parseAndReconcileCsv(e.target.result); };
  reader.onerror = function() { showToast('Could not read file', true); };
  reader.readAsText(file);
}

function parseAndReconcileCsv(text) {
  const lines = String(text || '').split(/\r?\n/);
  parsedCsvNames = [];
  const seen = {};
  lines.forEach(line => {
    let cleaned = line.replace(/"/g, '').trim();
    if (!cleaned) return;
    // Comma-separated row — take the first column as the name
    if (cleaned.indexOf(',') !== -1) {
      cleaned = cleaned.split(',')[0].trim();
    }
    if (!cleaned || cleaned.toLowerCase() === 'name') return; // skip header row
    const norm = normalizeName(cleaned);
    if (seen[norm]) return; // de-duplicate
    seen[norm] = true;
    parsedCsvNames.push(cleaned);
  });

  if (parsedCsvNames.length === 0) {
    showToast('No names found in CSV', true);
    return;
  }

  showToast('Parsed ' + parsedCsvNames.length + ' name(s) from CSV');
  runRosterReconciliation();
}

function normalizeName(name) {
  return String(name || '').toLowerCase()
    .replace(/[\s\-_]+/g, ' ') // unify spaces, underscores, hyphens
    .trim();
}

function runRosterReconciliation() {
  const registeredDevs = dashboardData.registeredDevelopers || [];

  const regNormSet = {};
  registeredDevs.forEach(r => { regNormSet[normalizeName(r.name)] = true; });
  const csvNormSet = {};
  parsedCsvNames.forEach(n => { csvNormSet[normalizeName(n)] = true; });

  // 1. Awaiting Onboarding: in CSV, but NOT registered
  const onboardingList = parsedCsvNames.filter(csvName => !regNormSet[normalizeName(csvName)]);

  // 2. Out of Sync / To Pause: registered, but NOT in CSV
  const unlistedList = registeredDevs.filter(regDev => !csvNormSet[normalizeName(regDev.name)]);

  renderReconResults(onboardingList, unlistedList);
}

function renderReconResults(onboard, unlisted) {
  const container = document.getElementById('reconResultsContainer');
  if (!container) return;
  container.style.display = 'block';
  document.getElementById('countOnboard').textContent = onboard.length;
  document.getElementById('countUnlisted').textContent = unlisted.length;

  const onboardTbody = document.getElementById('reconOnboardTbody');
  if (onboard.length === 0) {
    onboardTbody.innerHTML = '<tr><td colspan="2" class="empty-state">All developers in the CSV are already registered.</td></tr>';
  } else {
    onboardTbody.innerHTML = onboard.map(name => `
      <tr>
        <td style="font-weight:600">${esc(name)}</td>
        <td><button class="btn btn-primary btn-sm js-recon-register" data-name="${esc(name)}">+ Register</button></td>
      </tr>
    `).join('');
  }

  const unlistedTbody = document.getElementById('reconUnlistedTbody');
  if (unlisted.length === 0) {
    unlistedTbody.innerHTML = '<tr><td colspan="4" class="empty-state">All registered developers exist in the CSV.</td></tr>';
  } else {
    unlistedTbody.innerHTML = unlisted.map(dev => {
      const activeU = (dashboardData.activeUsers || []).find(u => u.name === dev.name) || {};
      const statusHtml = activeU.name ? getStatusDotHtml(activeU) : '<span class="status-dot dot-stalled"></span> Never seen';
      const lastSeen = activeU.lastSeen ? timeSince(activeU.lastSeen) : 'Never';
      const pauseBtnHtml = activeU.paused
        ? `<button class="btn btn-green btn-sm js-toggle-pause" data-name="${esc(dev.name)}" data-paused="true">&#9654; Resume</button>`
        : `<button class="btn btn-amber btn-sm js-toggle-pause" data-name="${esc(dev.name)}" data-paused="false">&#9208; Pause</button>`;
      return `
        <tr>
          <td style="font-weight:600">${esc(dev.name)}</td>
          <td><div class="status-cell">${statusHtml}</div></td>
          <td style="font-size:12px;color:var(--t3)">${lastSeen}</td>
          <td>
            <div class="action-cell">
              ${pauseBtnHtml}
              <button class="btn btn-red btn-sm js-remove-reg-dev" data-name="${esc(dev.name)}">&#128465; Delete</button>
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }
}

function switchReconTab(tab) {
  const onboardBtn = document.getElementById('tabOnboardBtn');
  const unlistedBtn = document.getElementById('tabUnlistedBtn');
  const onboardPanel = document.getElementById('reconOnboardPanel');
  const unlistedPanel = document.getElementById('reconUnlistedPanel');

  if (tab === 'onboard') {
    onboardBtn.classList.add('active'); unlistedBtn.classList.remove('active');
    onboardPanel.style.display = 'block'; unlistedPanel.style.display = 'none';
  } else {
    unlistedBtn.classList.add('active'); onboardBtn.classList.remove('active');
    unlistedPanel.style.display = 'block'; onboardPanel.style.display = 'none';
  }
}

function registerReconDev(name) {
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        showToast('Developer ' + name + ' registered');
        // fetchData(true) refreshes dashboardData and re-runs the
        // reconciliation once the fresh roster has actually arrived.
        fetchData(true);
      } else {
        showToast('Error: ' + res.error, true);
      }
    })
    .withFailureHandler(err => showToast('Failed: ' + err.message, true))
    .addRegisteredDeveloper(name);
}
