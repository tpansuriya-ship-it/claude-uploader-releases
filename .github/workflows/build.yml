name: Build and Release

on:
  push:
    branches: [ "codex/v2.0.4-reliability", "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Single source of truth for the release version. Bump this and the four
  # `--output dist/<ver>/...` paths in claude-usage-uploader/package.json together,
  # then tag v<ver>. Everything downstream reads RELEASE_VERSION rather than
  # repeating the number, which is what made the 2.0.5 -> 2.0.6 bump a ten-place
  # edit and a guaranteed broken build.
  RELEASE_VERSION: 2.0.7

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 11.9.0
        
    - name: Install dependencies
      working-directory: ./claude-usage-uploader
      run: pnpm install --frozen-lockfile --ignore-scripts
      
    - name: Run Tests
      working-directory: ./claude-usage-uploader
      run: |
        pnpm test
        node --check claude-usage-uploader.js
        node -e "new Function(require('fs').readFileSync('Code.gs','utf8')); console.log('Code.gs syntax OK')"
        
    - name: Build Binaries
      working-directory: ./claude-usage-uploader
      run: |
        pnpm prepare-tools
        mkdir -p dist/${RELEASE_VERSION}
        pnpm run build-win
        pnpm run build-mac-x64
        pnpm run build-mac-arm64
        pnpm run build-linux
        cp repair-v${RELEASE_VERSION}.ps1 Repair-Claude-Uploader.cmd dist/${RELEASE_VERSION}/
        sha256sum dist/${RELEASE_VERSION}/* | tee dist/${RELEASE_VERSION}/SHA256SUMS.txt
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: claude-usage-uploader-dist
        path: claude-usage-uploader/dist/${{ env.RELEASE_VERSION }}/

  windows-smoke:
    needs: build
    runs-on: windows-latest

    steps:
    - name: Download built artifacts
      uses: actions/download-artifact@v4
      with:
        name: claude-usage-uploader-dist
        path: dist-smoke

    - name: Smoke test Windows executable startup
      shell: pwsh
      run: |
        $exe = Resolve-Path "dist-smoke\ClaudeUsageUploader_v$env:RELEASE_VERSION-win-x64.exe"
        $work = Join-Path $env:RUNNER_TEMP 'claude-uploader-smoke'
        New-Item -ItemType Directory -Force -Path $work | Out-Null
        $copy = Join-Path $work 'ClaudeUsageUploader.exe'
        Copy-Item -LiteralPath $exe -Destination $copy -Force

        $psi = [System.Diagnostics.ProcessStartInfo]::new()
        $psi.FileName = $copy
        $psi.WorkingDirectory = $work
        $psi.UseShellExecute = $false
        $psi.RedirectStandardInput = $true
        $psi.RedirectStandardOutput = $true
        $psi.RedirectStandardError = $true
        $psi.Environment['APPDATA'] = Join-Path $work 'appdata'

        $proc = [System.Diagnostics.Process]::new()
        $proc.StartInfo = $psi
        [void]$proc.Start()
        Start-Sleep -Milliseconds 800
        try { $proc.StandardInput.WriteLine('') } catch {}
        if (-not $proc.WaitForExit(10000)) {
          $proc.Kill()
          $proc.WaitForExit()
          throw 'Windows executable hung during startup smoke test'
        }

        $stdout = $proc.StandardOutput.ReadToEnd()
        $stderr = $proc.StandardError.ReadToEnd()
        Write-Host $stdout
        Write-Host $stderr

        if ($proc.ExitCode -ne 1) {
          throw "Expected setup validation exit code 1, got $($proc.ExitCode)"
        }
        if ($stderr -notmatch 'AUTH_KEY_MISSING') {
          throw 'Executable did not reach setup validation path'
        }

  release:
    needs: [build, windows-smoke]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Download verified artifacts
      uses: actions/download-artifact@v4
      with:
        name: claude-usage-uploader-dist
        path: claude-usage-uploader/dist/${{ env.RELEASE_VERSION }}/

    # Explicit file list on purpose: release assets must never include
    # service-account keys or machine-generated launcher scripts.
    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Claude Usage Uploader ${{ github.ref_name }}
        body_path: claude-usage-uploader/RELEASE_NOTES_v${{ env.RELEASE_VERSION }}.md
        overwrite_files: true
        files: |
          claude-usage-uploader/dist/${{ env.RELEASE_VERSION }}/ClaudeUsageUploader_v${{ env.RELEASE_VERSION }}-win-x64.exe
          claude-usage-uploader/dist/${{ env.RELEASE_VERSION }}/ClaudeUsageUploader_v${{ env.RELEASE_VERSION }}-macos-x64
          claude-usage-uploader/dist/${{ env.RELEASE_VERSION }}/ClaudeUsageUploader_v${{ env.RELEASE_VERSION }}-macos-arm64
          claude-usage-uploader/dist/${{ env.RELEASE_VERSION }}/ClaudeUsageUploader_v${{ env.RELEASE_VERSION }}-linux-x64
          claude-usage-uploader/dist/${{ env.RELEASE_VERSION }}/repair-v${{ env.RELEASE_VERSION }}.ps1
          claude-usage-uploader/dist/${{ env.RELEASE_VERSION }}/Repair-Claude-Uploader.cmd
          claude-usage-uploader/dist/${{ env.RELEASE_VERSION }}/SHA256SUMS.txt
